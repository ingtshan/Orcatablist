<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrcaTab · Agent 会话</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #F4F7F6; --surface: #FFFFFF; --text: #17222A; --muted: #5C6B75;
      --line: #D5DEE1; --accent: #0E6C75; --accent-soft: #E1F0F1; --hover: #EDF3F2;
      --busy: #B45309; --waiting: #B91C1C; --idle: #2F855A; --offline: #8A97A0;
      --resume: #9A4E0A; --resume-soft: #FFF0DC;
      --focus-ring: #0E6C75; --danger-soft: #FCE8E8; --shadow: #17222A1A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E1417; --surface: #151C21; --text: #E4E9EC; --muted: #93A1AB;
        --line: #263039; --accent: #62C6CD; --accent-soft: #18343A; --hover: #1C272D;
        --busy: #F5A524; --waiting: #F87171; --idle: #4ADE80; --offline: #6B7A85;
        --resume: #F5A524; --resume-soft: #3A2815;
        --focus-ring: #62C6CD; --danger-soft: #3A2024; --shadow: #00000040;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
    button, input, select { color: inherit; font: inherit; }
    button, select { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
    .topbar { position: sticky; z-index: 10; top: 0; display: flex; align-items: center; gap: 16px; min-height: 68px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 3px 14px var(--shadow); }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 145px; font-weight: 750; letter-spacing: -.02em; }
    .brand-mark { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 9px; background: var(--accent); color: var(--surface); }
    [hidden] { display: none !important; }
    .search-wrap { position: relative; flex: 1; max-width: 780px; }
    .search-wrap::before { position: absolute; top: 50%; left: 14px; color: var(--muted); content: "⌕"; font-size: 20px; transform: translateY(-52%); }
    #search { width: 100%; height: 42px; padding: 0 16px 0 42px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
    #search:focus { border-color: var(--accent); background: var(--surface); }
    .mode-switch { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
    .mode-switch button { padding: 7px 13px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); }
    .mode-switch button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 5px var(--shadow); font-weight: 650; }
    .top-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    #index-status { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .layout { display: grid; grid-template-columns: 245px minmax(0, 1fr); width: min(1420px, 100%); margin: 0 auto; }
    .sidebar { position: sticky; top: 68px; align-self: start; height: calc(100vh - 68px); padding: 24px 16px; border-right: 1px solid var(--line); }
    .sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 4px 12px 10px; }
    .sidebar h2 { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .archive-scope { padding: 4px 7px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 11px; }
    .archive-scope:hover, .archive-scope[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
    #project-list { display: grid; gap: 4px; }
    .project-item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; border-radius: 9px; }
    .project-item:hover { background: var(--hover); }
    .project-button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; width: 100%; min-width: 0; padding: 10px 6px 10px 10px; border: 0; border-radius: 9px; background: transparent; text-align: left; }
    .project-button.active { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
    .project-button .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .project-control { min-width: 0; padding: 5px 6px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 11px; }
    .project-control:hover, .project-control.active { background: var(--surface); color: var(--accent); }
    .count { color: var(--muted); font-variant-numeric: tabular-nums; }
    main { min-width: 0; padding: 24px clamp(16px, 3vw, 44px) 60px; }
    .mobile-project-tools { display: none; gap: 8px; margin-bottom: 18px; }
    .mobile-project { display: none; width: 100%; height: 42px; margin-bottom: 18px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .group { margin-bottom: 30px; }
    .color-dot { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%; background: var(--project-color, var(--offline)); }
    .worktree-stack { display: grid; gap: 15px; }
    .worktree-cluster { min-width: 0; }
    .worktree-header { display: flex; min-width: 0; align-items: center; gap: 9px; margin: 0 3px 10px; }
    .worktree-name { max-width: 280px; flex: 0 0 auto; overflow: hidden; margin: 0; font: 700 16px ui-monospace, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .worktree-kind { flex: 0 0 auto; padding: 2px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 10px; font-weight: 650; }
    .worktree-path { min-width: 0; flex: 1 1 160px; overflow: hidden; color: var(--muted); font: 11px ui-monospace, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .worktree-meta { flex: 0 0 auto; color: var(--muted); font-size: 12px; }
    .worktree-focus { flex: 0 0 auto; min-width: 0; padding: 5px 9px; background: transparent; font-size: 12px; }
    .worktree-archive { flex: 0 0 auto; min-width: 0; padding: 5px 8px; border-color: transparent; background: transparent; color: var(--muted); font-size: 11px; }
    .worktree-archive:hover { border-color: var(--waiting); color: var(--waiting); }
    .worktree-archive.restore { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
    .session-list { overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: 0 6px 24px var(--shadow); }
    .session-row { display: grid; grid-template-columns: 12px minmax(180px, 1fr) minmax(90px, auto) auto auto; gap: 12px; align-items: center; min-height: 72px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .session-row:last-child { border-bottom: 0; }
    .session-row:hover, .session-row.keyboard-active { background: var(--hover); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--offline); box-shadow: 0 0 0 3px var(--bg); }
    .status-busy { background: var(--busy); } .status-waiting { background: var(--waiting); }
    .status-idle, .status-shell { background: var(--idle); } .status-offline { background: var(--offline); }
    .session-main { min-width: 0; }
    .session-title-line { display: flex; min-width: 0; align-items: center; gap: 7px; }
    .session-title { min-width: 0; overflow: hidden; font-size: 15px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .agent-badge { flex: 0 0 auto; padding: 2px 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--muted); font: 10px ui-monospace, Menlo, monospace; letter-spacing: .02em; }
    .agent-claude { border-color: #d68a56; color: #a95d2e; }
    .agent-codex { border-color: #6b9bd2; color: #3d72ad; }
    .agent-hermes { border-color: #8c78c6; color: #674da8; }
    .row-last-input { overflow: hidden; margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .hits { display: grid; gap: 3px; margin-top: 7px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .hit { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hit strong { color: var(--accent); font-weight: 750; }
    .chips { display: flex; max-width: 360px; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .chip { max-width: 160px; overflow: hidden; padding: 4px 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font: 11px ui-monospace, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
    button.goal-chip { background: var(--accent-soft); color: var(--accent); font-family: inherit; }
    button.goal-chip:hover { border-color: var(--accent); }
    .reason-chip { background: var(--bg); color: var(--accent); font-family: inherit; }
    .facts { display: grid; min-width: 92px; justify-items: end; gap: 4px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .actions { display: flex; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .action { min-width: 62px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); white-space: nowrap; }
    .action:hover { border-color: var(--accent); color: var(--accent); }
    .action.primary { border-color: var(--accent); background: var(--accent); color: var(--surface); }
    .action.danger { border-color: transparent; background: var(--danger-soft); color: var(--waiting); }
    .focus-action { min-width: 48px; padding: 5px 8px; border-radius: 7px; font-size: 12px; font-weight: 700; }
    .focus-jump { border-color: var(--accent); background: var(--accent); color: var(--surface); }
    .focus-jump:hover { border-color: var(--accent); color: var(--surface); filter: brightness(.95); }
    .focus-resume { border-color: var(--resume); background: var(--resume-soft); color: var(--resume); }
    .focus-resume:hover { border-color: var(--resume); color: var(--resume); filter: brightness(.96); }
    .action-drawer { min-width: 0; }
    .drawer-toggle { display: flex; min-width: 54px; align-items: center; justify-content: center; gap: 4px; padding: 5px 8px; color: var(--muted); font-size: 12px; list-style: none; }
    .drawer-toggle::-webkit-details-marker { display: none; }
    .drawer-toggle::after { content: "⌄"; font-size: 11px; transition: transform .12s ease; }
    .action-drawer[open] .drawer-toggle { border-color: var(--accent); color: var(--accent); }
    .action-drawer[open] .drawer-toggle::after { transform: rotate(180deg); }
    .action-drawer:not([open]) > .action-drawer-panel { display: none; }
    .action-drawer-panel { display: grid; gap: 5px; margin-top: 5px; padding: 5px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); box-shadow: 0 5px 16px var(--shadow); }
    .drawer-action { width: 100%; min-width: 92px; padding: 5px 7px; background: var(--surface); font-size: 11px; }
    .goal-picker { width: 112px; padding: 7px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .manual { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; min-width: 0; padding: 8px 10px; border-radius: 8px; background: var(--danger-soft); color: var(--muted); font-size: 12px; }
    .manual code { overflow: hidden; font: 12px ui-monospace, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .empty { padding: 70px 20px; border: 1px dashed var(--line); border-radius: 13px; color: var(--muted); text-align: center; }
    .project-management { width: min(1240px, 100%); margin: 0 auto; padding: 32px clamp(16px, 4vw, 54px) 64px; }
    .project-management-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .project-management-title h1 { margin: 0 0 6px; font-size: 25px; letter-spacing: -.02em; }
    .project-management-title p { margin: 0; color: var(--muted); font-size: 13px; }
    .project-management-search { width: min(420px, 100%); }
    #project-search { width: 100%; height: 42px; padding: 0 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    #project-search:focus { border-color: var(--accent); }
    .project-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 26px; }
    .project-stat { display: grid; gap: 3px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); text-align: left; }
    .project-stat:hover { border-color: var(--accent); }
    .project-stat[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .project-stat-value { font-size: 23px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .project-stat-label { color: var(--muted); font-size: 12px; }
    .project-list-head { display: flex; align-items: baseline; gap: 9px; margin: 0 2px 10px; }
    .project-list-head h2 { margin: 0; font-size: 16px; }
    .project-list-head span { color: var(--muted); font-size: 12px; }
    .project-management-list { overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: 0 6px 24px var(--shadow); }
    .managed-project { display: grid; grid-template-columns: minmax(250px, 1.7fr) minmax(110px, .55fr) minmax(120px, .65fr) auto; gap: 16px; align-items: center; min-height: 82px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .managed-project:last-child { border-bottom: 0; }
    .managed-project:hover { background: var(--hover); }
    .managed-project-main { display: flex; align-items: start; gap: 10px; min-width: 0; }
    .managed-project-main .color-dot { margin-top: 6px; }
    .managed-project-identity { min-width: 0; }
    .managed-project-title { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; min-width: 0; }
    .managed-project-name { overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .managed-project-path { overflow: hidden; margin-top: 5px; color: var(--muted); font: 11px ui-monospace, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .project-status { padding: 2px 7px; border-radius: 999px; background: var(--bg); color: var(--muted); font-size: 10px; font-weight: 650; }
    .project-status.pinned { background: var(--accent-soft); color: var(--accent); }
    .managed-project-metric { display: grid; gap: 3px; color: var(--muted); font-size: 11px; }
    .managed-project-metric strong { color: var(--text); font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .managed-project-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .goals-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); width: min(1420px, 100%); min-height: calc(100vh - 68px); margin: 0 auto; }
    .goal-sidebar { position: sticky; top: 68px; align-self: start; height: calc(100vh - 68px); padding: 22px 16px; border-right: 1px solid var(--line); }
    .goal-sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 6px 14px; }
    .goal-sidebar-head h2, .goal-section h3 { margin: 0; }
    .goal-list { display: grid; gap: 7px; }
    .goal-card { width: 100%; padding: 12px; border: 1px solid transparent; border-radius: 10px; background: transparent; text-align: left; }
    .goal-card:hover { background: var(--hover); }
    .goal-card.selected { border-color: var(--line); background: var(--accent-soft); }
    .goal-card-name { display: block; overflow: hidden; margin-bottom: 7px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .goal-card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; color: var(--muted); font-size: 11px; }
    .status-pill { display: inline-flex; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 650; }
    .status-done { background: #DDF3E5; color: #28764A; }
    .status-archived { background: var(--bg); color: var(--muted); }
    .goal-detail { min-width: 0; padding: 24px clamp(16px, 3vw, 44px) 60px; }
    .goal-editor { display: grid; grid-template-columns: minmax(180px, 1fr) 150px minmax(180px, 1fr) auto auto; gap: 12px; align-items: end; margin-bottom: 30px; padding: 18px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: 0 6px 24px var(--shadow); }
    .field { display: grid; gap: 6px; min-width: 0; color: var(--muted); font-size: 12px; }
    .field input, .field select, .dialog-form input { min-width: 0; height: 40px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
    .goal-section { margin: 0 0 28px; }
    .goal-section-head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; }
    .goal-section-head span { color: var(--muted); font-size: 12px; }
    .goal-session-list { overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: 0 6px 24px var(--shadow); }
    dialog { width: min(460px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); box-shadow: 0 18px 60px #0006; }
    dialog::backdrop { background: #0007; }
    .dialog-form { display: grid; gap: 15px; padding: 22px; }
    .dialog-form h2 { margin: 0; font-size: 19px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; }
    #toast { position: fixed; right: 24px; bottom: 22px; z-index: 20; padding: 10px 14px; border-radius: 9px; background: var(--text); color: var(--surface); box-shadow: 0 5px 20px var(--shadow); opacity: 0; transform: translateY(8px); transition: .16s ease; pointer-events: none; }
    #toast.visible { opacity: 1; transform: translateY(0); }
    @media (max-width: 899px) {
      .topbar { flex-wrap: wrap; gap: 10px; padding: 10px 14px; }
      .brand { min-width: auto; }
      .search-wrap { order: 3; min-width: 100%; }
      .top-actions { margin-left: auto; }
      .layout { display: block; }
      .goals-layout { display: block; }
      .sidebar { display: none; }
      .goal-sidebar { position: static; width: auto; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .goal-list { display: flex; overflow-x: auto; padding-bottom: 4px; }
      .goal-card { min-width: 210px; }
      .goal-detail { padding-top: 18px; }
      .goal-editor { grid-template-columns: 1fr 1fr; }
      .project-management { padding-top: 22px; }
      .project-management-head { align-items: stretch; flex-direction: column; gap: 14px; }
      .project-management-search { width: 100%; }
      .managed-project { grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; }
      .managed-project-actions { grid-column: 1 / -1; justify-content: flex-start; }
      main { padding-top: 18px; }
      .mobile-project-tools { display: flex; }
      .mobile-project { display: block; flex: 1; margin: 0; }
      .worktree-header { flex-wrap: wrap; }
      .worktree-path { order: 3; flex-basis: 100%; }
      .session-row { grid-template-columns: 12px minmax(0, 1fr) auto; }
      .chips { grid-column: 2 / -1; justify-content: flex-start; }
      .facts { grid-column: 2; grid-row: 3; justify-items: start; }
      .actions { grid-column: 3; grid-row: 2 / 4; flex-direction: column; }
      .manual { grid-column: 2 / -1; }
    }
    @media (max-width: 560px) {
      .brand span:last-child { display: none; }
      .view-switch button { padding-inline: 9px; }
      .project-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .managed-project { grid-template-columns: minmax(0, 1fr) auto; }
      .managed-project-metric.activity { grid-column: 1 / -1; }
      .goal-editor { grid-template-columns: 1fr; }
      .session-row { gap: 9px; padding: 12px 10px; }
      .chips { max-width: 100%; }
      .chip { max-width: 115px; }
      .action { min-width: 54px; padding-inline: 7px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">O</span><span>OrcaTab</span></div>
    <div class="mode-switch view-switch" aria-label="主视图">
      <button id="sessions-view-button" type="button" aria-pressed="true">会话</button>
      <button id="projects-view-button" type="button" aria-pressed="false">项目</button>
      <button id="goals-view-button" type="button" aria-pressed="false">目标</button>
    </div>
    <div class="search-wrap session-only"><input id="search" type="search" autocomplete="off" placeholder="搜索会话内容… 按 / 聚焦" aria-label="搜索会话内容"></div>
    <div class="top-actions">
      <span id="index-status">索引更新时间未知</span>
      <div class="mode-switch session-only" aria-label="会话范围">
        <button id="all-mode" type="button" aria-pressed="true">全部</button>
        <button id="live-mode" type="button" aria-pressed="false">在线</button>
      </div>
    </div>
  </header>
  <div id="sessions-view" class="layout">
    <aside class="sidebar">
      <div class="sidebar-head"><h2 id="project-scope-title">项目</h2><button id="archived-projects" class="archive-scope" type="button" aria-pressed="false">已归档 0</button></div>
      <nav id="project-list" aria-label="项目筛选"></nav>
    </aside>
    <main>
      <div class="mobile-project-tools">
        <select id="mobile-project" class="mobile-project" aria-label="项目筛选"><option value="">全部项目</option></select>
        <button id="mobile-archived-projects" class="action archive-scope" type="button" aria-pressed="false">已归档 0</button>
      </div>
      <div id="content" aria-live="polite"></div>
    </main>
  </div>
  <div id="projects-view" class="project-management" hidden>
    <header class="project-management-head">
      <div class="project-management-title"><h1>项目管理</h1><p>集中查找、置顶和归档项目；归档不会删除任何会话。</p></div>
      <label class="project-management-search"><input id="project-search" type="search" autocomplete="off" placeholder="搜索名称或路径…" aria-label="搜索项目"></label>
    </header>
    <div id="project-summary" class="project-summary" aria-label="项目状态筛选">
      <button class="project-stat" type="button" data-project-scope="active" aria-pressed="true"><span id="active-project-count" class="project-stat-value">0</span><span class="project-stat-label">活跃项目</span></button>
      <button class="project-stat" type="button" data-project-scope="pinned" aria-pressed="false"><span id="pinned-project-count" class="project-stat-value">0</span><span class="project-stat-label">已置顶</span></button>
      <button class="project-stat" type="button" data-project-scope="archived" aria-pressed="false"><span id="archived-project-count" class="project-stat-value">0</span><span class="project-stat-label">已归档</span></button>
      <button class="project-stat" type="button" data-project-scope="all" aria-pressed="false"><span id="all-project-count" class="project-stat-value">0</span><span class="project-stat-label">全部项目</span></button>
    </div>
    <div class="project-list-head"><h2>项目</h2><span id="managed-project-count">显示 0 个</span></div>
    <div id="project-management-list" class="project-management-list" aria-live="polite"></div>
  </div>
  <div id="goals-view" class="goals-layout" hidden>
    <aside class="goal-sidebar">
      <div class="goal-sidebar-head"><h2>目标</h2><button id="new-goal" class="action primary" type="button">＋ 新建目标</button></div>
      <nav id="goal-list" class="goal-list" aria-label="目标列表"></nav>
    </aside>
    <main id="goal-detail" class="goal-detail" aria-live="polite"></main>
  </div>
  <dialog id="goal-dialog">
    <form id="goal-dialog-form" class="dialog-form">
      <h2>新建目标</h2>
      <label class="field">名称<input id="new-goal-name" name="name" required maxlength="160" autofocus></label>
      <label class="field">外部引用<input id="new-goal-ref" name="externalRef" placeholder="可选：gtd:5 或备注"></label>
      <div class="dialog-actions">
        <button id="cancel-goal" class="action" type="button">取消</button>
        <button class="action primary" type="submit">创建</button>
      </div>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script>
    (() => {
      const POLL_MS = 5000;
      const SEARCH_DEBOUNCE_MS = 200;
      const RESULT_RESET_MS = 2000;
      const LIVE_POOL_LIMIT = 5000;
      const VISIBLE_SESSION_LIMIT = 500;
      const state = {
        projects: [], sessions: [], selectedProject: "", liveOnly: false, query: "", requestId: 0,
        activeRow: -1, projectEtag: "", sessionEtag: "", view: "sessions",
        goals: [], selectedGoalId: "", goalDetail: null, linkAfterCreate: null,
        sourceSessions: [], liveBySession: {}, liveEtag: "", worktreeEtag: "",
        archivedWorktrees: new Map(), showArchived: false,
        projectScope: "active", projectQuery: "",
      };
      const searchInput = document.querySelector("#search");
      const content = document.querySelector("#content");
      const sessionsView = document.querySelector("#sessions-view");
      const projectsView = document.querySelector("#projects-view");
      const goalsView = document.querySelector("#goals-view");
      const sessionsViewButton = document.querySelector("#sessions-view-button");
      const projectsViewButton = document.querySelector("#projects-view-button");
      const goalsViewButton = document.querySelector("#goals-view-button");
      const projectSearchInput = document.querySelector("#project-search");
      const projectSummary = document.querySelector("#project-summary");
      const projectManagementList = document.querySelector("#project-management-list");
      const managedProjectCount = document.querySelector("#managed-project-count");
      const activeProjectCount = document.querySelector("#active-project-count");
      const pinnedProjectCount = document.querySelector("#pinned-project-count");
      const archivedProjectCount = document.querySelector("#archived-project-count");
      const allProjectCount = document.querySelector("#all-project-count");
      const projectList = document.querySelector("#project-list");
      const mobileProject = document.querySelector("#mobile-project");
      const projectScopeTitle = document.querySelector("#project-scope-title");
      const archivedProjects = document.querySelector("#archived-projects");
      const mobileArchivedProjects = document.querySelector("#mobile-archived-projects");
      const allMode = document.querySelector("#all-mode");
      const liveMode = document.querySelector("#live-mode");
      const indexStatus = document.querySelector("#index-status");
      const goalList = document.querySelector("#goal-list");
      const goalDetail = document.querySelector("#goal-detail");
      const newGoalButton = document.querySelector("#new-goal");
      const goalDialog = document.querySelector("#goal-dialog");
      const goalDialogForm = document.querySelector("#goal-dialog-form");
      const newGoalName = document.querySelector("#new-goal-name");
      const newGoalRef = document.querySelector("#new-goal-ref");
      const cancelGoal = document.querySelector("#cancel-goal");
      const toast = document.querySelector("#toast");
      let searchTimer = 0;
      let toastTimer = 0;

      async function api(path, options) {
        const response = await fetch(path, options);
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        return body;
      }

      async function conditionalApi(path, etag) {
        const headers = etag ? { "If-None-Match": etag } : {};
        const response = await fetch(path, { headers });
        if (response.status === 304) return { unchanged: true, etag };
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        return { unchanged: false, etag: response.headers.get("ETag") || "", body };
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("visible"), RESULT_RESET_MS);
      }

      function basename(path) {
        return path ? path.replace(/\/+$/, "").split("/").pop() || path : "";
      }

      function relativeTime(timestamp) {
        if (timestamp == null) return "无时间";
        const minutes = Math.max(0, Math.floor((Date.now() - timestamp) / 60000));
        if (minutes < 1) return "刚刚";
        if (minutes < 60) return `${minutes} 分钟前`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours} 小时前`;
        return `${Math.floor(hours / 24)} 天前`;
      }

      function projectFor(key) {
        return state.projects.find((project) => project.key === key)
          || { key, name: basename(key) || "未知", root: "", color: null, pinned: false, archived: false };
      }

      function visibleProjects() {
        if (!state.showArchived) return state.projects.filter((project) => !project.archived);
        const projectKeys = new Set(state.archivedWorktrees.values());
        return state.projects.filter((project) => project.archived || projectKeys.has(project.key));
      }

      function worktreeRootFor(row, project = projectFor(row.projectKey)) {
        return row.worktreeRoot || row.cwd || project.root || "";
      }

      function applyWorktreePreferences(preferences) {
        state.archivedWorktrees = new Map(preferences
          .filter((preference) => preference.archived)
          .map((preference) => [preference.root, preference.projectKey]));
      }

      function groupedWorktrees(rows, project) {
        const groups = new Map();
        rows.forEach((row) => {
          const root = worktreeRootFor(row, project);
          const key = root || "__unknown_worktree__";
          const group = groups.get(key) || { root, detected: false, latest: 0, rows: [] };
          group.detected ||= Boolean(row.worktreeRoot);
          group.latest = Math.max(group.latest, row.lastInputAt || 0);
          group.rows.push(row);
          groups.set(key, group);
        });
        return [...groups.values()].sort((a, b) => b.latest - a.latest || a.root.localeCompare(b.root));
      }

      function worktreeKind(group, project) {
        if (!group.detected) return "工作目录";
        return group.root === project.root ? "主 worktree" : "关联 worktree";
      }

      function sessionKey(row) { return `${row.agent}/${row.sid}`; }

      function syncSessionLive() {
        state.sourceSessions.forEach((row) => { row.live = state.liveBySession[sessionKey(row)] || null; });
        const scoped = state.sourceSessions.filter((row) => {
          const project = projectFor(row.projectKey);
          const worktreeArchived = state.archivedWorktrees.has(worktreeRootFor(row, project));
          return state.showArchived
            ? project.archived || (!project.archived && worktreeArchived)
            : !project.archived && !worktreeArchived;
        });
        const rows = state.liveOnly ? scoped.filter((row) => row.live) : scoped;
        state.sessions = rows.slice(0, VISIBLE_SESSION_LIMIT);
      }

      function patchSessionLive() {
        const rows = new Map(state.sessions.map((row) => [sessionKey(row), row]));
        document.querySelectorAll(".session-row").forEach((element) => {
          const row = rows.get(`${element.dataset.agent}/${element.dataset.sid}`);
          if (!row) return;
          const status = row.live?.status || "offline";
          const dot = element.querySelector(".status-dot");
          if (dot) {
            dot.className = `status-dot status-${status}`;
            dot.title = row.live ? `${status}${row.live.name ? ` · ${row.live.name}` : ""}` : "offline";
          }
          const button = element.querySelector(".focus-action");
          if (button && (button.textContent === "跳转" || button.textContent === "恢复")) {
            button.textContent = row.live ? "跳转" : "恢复";
            button.classList.toggle("focus-jump", Boolean(row.live));
            button.classList.toggle("focus-resume", !row.live);
          }
        });
      }

      function make(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text != null) element.textContent = text;
        return element;
      }

      function appendHighlighted(parent, snippet) {
        let remaining = snippet;
        while (remaining) {
          const start = remaining.indexOf("‹");
          const end = start < 0 ? -1 : remaining.indexOf("›", start + 1);
          if (start < 0 || end < 0) { parent.append(document.createTextNode(remaining)); return; }
          parent.append(document.createTextNode(remaining.slice(0, start)));
          parent.append(make("strong", "", remaining.slice(start + 1, end)));
          remaining = remaining.slice(end + 1);
        }
      }

      async function copyText(text, message) {
        try { await navigator.clipboard.writeText(text); showToast(message); }
        catch (error) { showToast(`复制失败：${error.message}`); }
      }

      function renderManual(rowElement, result) {
        rowElement.querySelector(".manual")?.remove();
        const panel = make("div", "manual");
        if (result.command) {
          panel.append(make("code", "", result.command));
          const button = make("button", "action", "复制命令");
          button.type = "button";
          button.addEventListener("click", () => copyText(result.command, "已复制命令"));
          panel.append(button);
        } else {
          panel.textContent = result.reason === "running-outside-orca" ? "该会话正在 Orca 外运行，无法重复恢复。" : `需要手动处理：${result.reason}`;
        }
        rowElement.append(panel);
      }

      async function focusSession(row, button, rowElement) {
        const defaultLabel = () => row.live ? "跳转" : "恢复";
        button.disabled = true;
        button.textContent = "处理中…";
        try {
          const result = await api(`/api/focus/${encodeURIComponent(row.agent)}/${encodeURIComponent(row.sid)}`, { method: "POST" });
          if (result.action === "switched") {
            button.textContent = "已切到 tab";
            setTimeout(() => { button.textContent = defaultLabel(); }, RESULT_RESET_MS);
          } else if (result.action === "resumed") {
            button.textContent = "已在 Orca 恢复";
            setTimeout(() => { button.textContent = defaultLabel(); }, RESULT_RESET_MS);
          } else {
            button.textContent = defaultLabel();
            renderManual(rowElement, result);
          }
        } catch (error) {
          button.textContent = defaultLabel();
          showToast(`跳转失败：${error.message}`);
        } finally { button.disabled = false; }
      }

      async function focusProject(project, button) {
        const original = "回到 Orca";
        button.disabled = true;
        button.textContent = "切换中…";
        try {
          const result = await api("/api/projects/focus", jsonRequest("POST", { projectKey: project.key }));
          if (result.action === "switched") {
            button.textContent = "已切回";
            showToast(`已切回 Orca · ${project.name}`);
            setTimeout(() => { button.textContent = original; }, RESULT_RESET_MS);
          } else {
            button.textContent = original;
            showToast("该 worktree 没有可切回的 Orca 终端");
          }
        } catch (error) {
          button.textContent = original;
          showToast(`切换失败：${error.message}`);
        } finally { button.disabled = false; }
      }

      async function focusWorktreeSession(row, worktreeName, button) {
        const original = "回到 Orca";
        button.disabled = true;
        button.textContent = "切换中…";
        try {
          const result = await api(`/api/focus/${encodeURIComponent(row.agent)}/${encodeURIComponent(row.sid)}`, { method: "POST" });
          if (result.action === "switched" || result.action === "resumed") {
            button.textContent = "已切回";
            showToast(`已切回 ${worktreeName} · ${row.displayTitle}`);
            setTimeout(() => { button.textContent = original; }, RESULT_RESET_MS);
          } else {
            button.textContent = original;
            showToast("无法自动回到该 worktree 的第一个会话");
          }
        } catch (error) {
          button.textContent = original;
          showToast(`切换失败：${error.message}`);
        } finally { button.disabled = false; }
      }

      function sessionRow(row, project, isSearch, options = {}) {
        const element = make("article", "session-row");
        element.tabIndex = -1;
        element.dataset.sid = row.sid;
        element.dataset.agent = row.agent;
        const status = row.live?.status || "offline";
        const dot = make("span", `status-dot status-${status}`);
        dot.title = row.live ? `${status}${row.live.name ? ` · ${row.live.name}` : ""}` : "offline";
        element.append(dot);

        const main = make("div", "session-main");
        const titleLine = make("div", "session-title-line");
        titleLine.append(make("span", `agent-badge agent-${row.agent}`, row.agent));
        const title = make("div", "session-title", row.displayTitle);
        if (row.title && row.firstPrompt) title.title = row.firstPrompt;
        titleLine.append(title);
        main.append(titleLine);
        if (!isSearch && row.lastPrompt && row.lastPrompt !== row.displayTitle) {
          const lastInput = make("div", "row-last-input", row.lastPrompt);
          lastInput.title = row.lastPrompt;
          main.append(lastInput);
        }
        if (Array.isArray(row.hits) && row.hits.length) {
          const hits = make("div", "hits");
          row.hits.slice(0, 3).forEach((hit) => {
            const line = make("div", "hit");
            appendHighlighted(line, hit.snippet);
            hits.append(line);
          });
          main.append(hits);
        }
        element.append(main);

        const chips = make("div", "chips");
        if (row.cwd && row.cwd !== (row.worktreeRoot || project.root)) chips.append(make("span", "chip", basename(row.cwd)));
        if (row.branch && row.branch !== "HEAD") chips.append(make("span", "chip", row.branch));
        (row.goals || []).forEach((goal) => {
          const button = make("button", "chip goal-chip", goal.name);
          button.type = "button";
          button.title = "打开目标：" + goal.name;
          button.addEventListener("click", () => selectGoal(goal.id));
          chips.append(button);
        });
        (options.reasons || []).forEach((reason) => chips.append(make("span", "chip reason-chip", reason.label)));
        element.append(chips);

        const facts = make("div", "facts");
        facts.append(make("span", "", relativeTime(row.lastInputAt)), make("span", "", `${row.promptCount} 轮`));
        element.append(facts);

        const actions = make("div", "actions");
        const focusButton = make(
          "button", `action focus-action ${row.live ? "focus-jump" : "focus-resume"}`,
          row.live ? "跳转" : "恢复",
        );
        focusButton.type = "button";
        focusButton.addEventListener("click", () => focusSession(row, focusButton, element));
        const drawer = make("details", "action-drawer");
        const drawerToggle = make("summary", "action drawer-toggle", "更多");
        const drawerPanel = make("div", "action-drawer-panel");
        const copyButton = make("button", "action drawer-action copy-action", "复制链接");
        copyButton.type = "button";
        copyButton.addEventListener("click", async () => {
          await copyText(`orcatab://${row.agent}/${row.sid}`, "已复制链接");
          drawer.open = false;
        });
        const commandButton = make("button", "action drawer-action command-action", "复制命令");
        commandButton.type = "button";
        commandButton.addEventListener("click", async () => {
          const command = row.agent === "codex" ? `codex resume ${row.sid}`
            : row.agent === "hermes" ? `hermes --resume ${row.sid}` : `claude --resume ${row.sid}`;
          await copyText(command, "已复制命令");
          drawer.open = false;
        });
        drawerPanel.append(copyButton, commandButton);
        drawer.append(drawerToggle, drawerPanel);
        drawer.addEventListener("toggle", () => {
          if (!drawer.open) return;
          document.querySelectorAll(".action-drawer[open]").forEach((candidate) => {
            if (candidate !== drawer) candidate.removeAttribute("open");
          });
        });
        actions.append(focusButton, drawer);
        if (options.goalPicker) {
          const picker = make("select", "goal-picker");
          picker.setAttribute("aria-label", "添加到目标");
          picker.append(new Option("＋目标", ""));
          const linked = new Set((row.goals || []).map((goal) => goal.id));
          state.goals.filter((goal) => !linked.has(goal.id))
            .forEach((goal) => picker.append(new Option(goal.name, goal.id)));
          picker.append(new Option("新建…", "__new__"));
          picker.addEventListener("change", async () => {
            const value = picker.value;
            picker.value = "";
            if (!value) return;
            if (value === "__new__") { openGoalDialog(row); return; }
            await linkSession(value, row, "confirmed", false);
          });
          actions.append(picker);
        }
        (options.extraActions || []).forEach((item) => {
          const button = make("button", "action " + (item.className || ""), item.label);
          button.type = "button";
          button.addEventListener("click", () => item.run(button));
          actions.append(button);
        });
        element.append(actions);
        return element;
      }

      function render() {
        state.activeRow = -1;
        const isSearch = Boolean(state.query);
        content.replaceChildren();
        if (!state.sessions.length) {
          content.append(make("div", "empty", state.query ? "没有匹配的会话" : "当前筛选下没有会话"));
          return;
        }
        const groups = new Map();
        state.sessions.forEach((row) => {
          const rows = groups.get(row.projectKey) || [];
          rows.push(row);
          groups.set(row.projectKey, rows);
        });
        const orderedKeys = visibleProjects().map((project) => project.key).filter((key) => groups.has(key));
        groups.forEach((_rows, key) => { if (!orderedKeys.includes(key)) orderedKeys.push(key); });
        orderedKeys.forEach((key) => {
          const rows = groups.get(key);
          const project = projectFor(key);
          const section = make("div", "group");
          const stack = make("div", "worktree-stack");
          groupedWorktrees(rows, project).forEach((worktree) => {
            const cluster = make("section", "worktree-cluster");
            cluster.dataset.worktreeRoot = worktree.root;
            const worktreeRows = [...worktree.rows]
              .sort((a, b) => (b.lastInputAt || 0) - (a.lastInputAt || 0));
            const firstSession = worktreeRows[0];
            const worktreeHeader = make("header", "worktree-header");
            const color = make("span", "color-dot");
            if (project.color) color.style.setProperty("--project-color", project.color);
            const worktreeName = basename(worktree.root) || "未知目录";
            const name = make("h2", "worktree-name", worktreeName);
            name.title = worktree.root || "未识别 worktree";
            const path = make("span", "worktree-path", worktree.root || "未识别 worktree");
            path.title = worktree.root || "未识别 worktree";
            const worktreeArchived = state.archivedWorktrees.has(worktree.root);
            const focus = make("button", "action worktree-focus", "回到 Orca");
            focus.type = "button";
            focus.dataset.agent = firstSession.agent;
            focus.dataset.sid = firstSession.sid;
            focus.title = `回到第一个会话：${firstSession.displayTitle}`;
            focus.addEventListener("click", () => focusWorktreeSession(firstSession, worktreeName, focus));
            worktreeHeader.append(
              color,
              name,
              make("span", "worktree-kind", worktreeKind(worktree, project)),
              path,
              make("span", "worktree-meta", `${worktree.rows.length} 个会话 · 最近 ${relativeTime(worktree.latest || null)}`),
              focus,
            );
            if (!project.archived && worktree.root) {
              const archive = make(
                "button", `action worktree-archive${worktreeArchived ? " restore" : ""}`,
                worktreeArchived ? "恢复" : "归档",
              );
              archive.type = "button";
              archive.title = `${worktreeArchived ? "恢复" : "归档"} worktree：${worktreeName}`;
              archive.addEventListener("click", () => updateWorktreePreference(
                project, worktree.root, !worktreeArchived, archive,
              ));
              worktreeHeader.append(archive);
            }
            const list = make("div", "session-list");
            worktreeRows.forEach((row) => list.append(sessionRow(row, project, isSearch, { goalPicker: true })));
            cluster.append(worktreeHeader, list);
            stack.append(cluster);
          });
          section.append(stack);
          content.append(section);
        });
      }

      function renderProjects() {
        projectList.replaceChildren();
        const archivedProjectKeys = new Set(state.projects.filter((project) => project.archived).map((project) => project.key));
        const activeProjectKeys = new Set(state.projects.filter((project) => !project.archived).map((project) => project.key));
        const archivedProjectCount = archivedProjectKeys.size;
        const archivedWorktreeCount = [...state.archivedWorktrees.values()]
          .filter((projectKey) => activeProjectKeys.has(projectKey)).length;
        const archivedCount = archivedProjectCount + archivedWorktreeCount;
        const scopeLabel = state.showArchived ? "返回项目" : `已归档 ${archivedCount}`;
        projectScopeTitle.textContent = state.showArchived ? "已归档" : "项目";
        for (const toggle of [archivedProjects, mobileArchivedProjects]) {
          toggle.textContent = scopeLabel;
          toggle.setAttribute("aria-pressed", String(state.showArchived));
        }
        mobileProject.replaceChildren(new Option(state.showArchived ? "全部归档" : "全部项目", ""));
        visibleProjects().forEach((project) => {
          const item = make("div", "project-item");
          const button = make("button", `project-button${state.selectedProject === project.key ? " active" : ""}`);
          button.type = "button";
          button.append(make("span", "name", project.name), make("span", "count", String(project.sessionCount)));
          button.addEventListener("click", () => selectProject(state.selectedProject === project.key ? "" : project.key));
          item.append(button);
          if (!project.archived) {
            item.append(projectPreferenceButton(
              project, project.pinned ? "取消置顶" : "置顶", { pinned: !project.pinned }, `project-control${project.pinned ? " active" : ""}`,
            ));
          }
          item.append(projectPreferenceButton(
            project, project.archived ? "恢复" : "归档", { archived: !project.archived }, "project-control",
          ));
          projectList.append(item);
          mobileProject.append(new Option(`${project.name} (${project.sessionCount})`, project.key));
        });
        mobileProject.value = state.selectedProject;
      }

      function filteredManagedProjects() {
        const query = state.projectQuery.toLocaleLowerCase("zh-CN");
        return state.projects.filter((project) => {
          const inScope = state.projectScope === "all"
            || (state.projectScope === "active" && !project.archived)
            || (state.projectScope === "pinned" && project.pinned)
            || (state.projectScope === "archived" && project.archived);
          if (!inScope) return false;
          if (!query) return true;
          return `${project.name} ${project.root} ${project.key}`.toLocaleLowerCase("zh-CN").includes(query);
        });
      }

      function managedProjectMetric(value, label, className = "") {
        const metric = make("div", `managed-project-metric ${className}`.trim());
        metric.append(make("strong", "", value), make("span", "", label));
        return metric;
      }

      function renderProjectManagement() {
        const active = state.projects.filter((project) => !project.archived).length;
        const pinned = state.projects.filter((project) => project.pinned).length;
        const archived = state.projects.filter((project) => project.archived).length;
        activeProjectCount.textContent = String(active);
        pinnedProjectCount.textContent = String(pinned);
        archivedProjectCount.textContent = String(archived);
        allProjectCount.textContent = String(state.projects.length);
        projectSummary.querySelectorAll("[data-project-scope]").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.projectScope === state.projectScope));
        });

        const projects = filteredManagedProjects();
        managedProjectCount.textContent = `显示 ${projects.length} / ${state.projects.length} 个`;
        projectManagementList.replaceChildren();
        if (!projects.length) {
          projectManagementList.append(make("div", "empty", state.projectQuery ? "没有匹配的项目" : "当前筛选下没有项目"));
          return;
        }

        projects.forEach((project) => {
          const row = make("article", "managed-project");
          row.dataset.projectKey = project.key;
          const main = make("div", "managed-project-main");
          const color = make("span", "color-dot");
          if (project.color) color.style.setProperty("--project-color", project.color);
          const identity = make("div", "managed-project-identity");
          const title = make("div", "managed-project-title");
          title.append(make("span", "managed-project-name", project.name));
          if (project.pinned) title.append(make("span", "project-status pinned", "置顶"));
          if (project.archived) title.append(make("span", "project-status", "已归档"));
          identity.append(title, make("div", "managed-project-path", project.root || project.key));
          main.append(color, identity);

          const actions = make("div", "managed-project-actions");
          const sessions = make("button", "action primary", "查看会话");
          sessions.type = "button";
          sessions.addEventListener("click", () => openManagedProjectSessions(project));
          const focus = make("button", "action", "回到 Orca");
          focus.type = "button";
          focus.addEventListener("click", () => focusProject(project, focus));
          actions.append(sessions, focus);
          if (!project.archived) {
            actions.append(projectPreferenceButton(
              project, project.pinned ? "取消置顶" : "置顶", { pinned: !project.pinned }, "action",
            ));
          }
          actions.append(projectPreferenceButton(
            project, project.archived ? "恢复" : "归档", { archived: !project.archived }, "action",
          ));
          row.append(
            main,
            managedProjectMetric(String(project.sessionCount), "会话"),
            managedProjectMetric(relativeTime(project.lastInputAt), "最近活动", "activity"),
            actions,
          );
          projectManagementList.append(row);
        });
      }

      function jsonRequest(method, body) {
        return { method, headers: { "content-type": "application/json" }, body: JSON.stringify(body) };
      }

      function projectPreferenceButton(project, label, patch, className) {
        const button = make("button", className, label);
        button.type = "button";
        button.title = `${label}项目 ${project.name}`;
        button.setAttribute("aria-label", button.title);
        button.addEventListener("click", () => updateProjectPreference(project, patch, button));
        return button;
      }

      async function updateProjectPreference(project, patch, button) {
        button.disabled = true;
        try {
          await api("/api/projects", jsonRequest("PATCH", { projectKey: project.key, ...patch }));
          const projects = await conditionalApi("/api/projects", "");
          state.projects = projects.body;
          state.projectEtag = projects.etag;
          if (patch.archived !== undefined && state.selectedProject === project.key) state.selectedProject = "";
          syncSessionLive();
          renderProjects();
          render();
          renderProjectManagement();
          const message = patch.archived === true ? `已归档 ${project.name}，可在“已归档”中恢复`
            : patch.archived === false ? `已恢复 ${project.name}`
              : patch.pinned ? `已置顶 ${project.name}` : `已取消置顶 ${project.name}`;
          showToast(message);
        } catch (error) { showToast(`更新项目失败：${error.message}`); }
        finally { button.disabled = false; }
      }

      async function updateWorktreePreference(project, root, archived, button) {
        button.disabled = true;
        const name = basename(root) || root;
        try {
          await api("/api/worktrees", jsonRequest("PATCH", { projectKey: project.key, root, archived }));
          const preferences = await conditionalApi("/api/worktrees", "");
          applyWorktreePreferences(preferences.body);
          state.worktreeEtag = preferences.etag;
          if (!archived && state.showArchived
            && ![...state.archivedWorktrees.values()].includes(project.key)) state.selectedProject = "";
          syncSessionLive();
          renderProjects();
          render();
          showToast(archived
            ? `已归档 worktree ${name}，可在“已归档”中恢复`
            : `已恢复 worktree ${name}`);
        } catch (error) { showToast(`更新 worktree 失败：${error.message}`); }
        finally { button.disabled = false; }
      }

      async function openManagedProjectSessions(project) {
        state.showArchived = project.archived;
        state.selectedProject = project.key;
        state.query = "";
        state.liveOnly = false;
        searchInput.value = "";
        allMode.setAttribute("aria-pressed", "true");
        liveMode.setAttribute("aria-pressed", "false");
        state.sessionEtag = "";
        await setView("sessions", false);
        renderProjects();
        await loadList();
      }

      function openGoalDialog(row = null) {
        state.linkAfterCreate = row;
        goalDialogForm.reset();
        goalDialog.showModal();
        newGoalName.focus();
      }

      async function setView(view, refresh = true) {
        state.view = view;
        const sessionsActive = view === "sessions";
        const projectsActive = view === "projects";
        const goalsActive = view === "goals";
        sessionsView.hidden = !sessionsActive;
        projectsView.hidden = !projectsActive;
        goalsView.hidden = !goalsActive;
        document.querySelectorAll(".session-only").forEach((element) => { element.hidden = !sessionsActive; });
        sessionsViewButton.setAttribute("aria-pressed", String(sessionsActive));
        projectsViewButton.setAttribute("aria-pressed", String(projectsActive));
        goalsViewButton.setAttribute("aria-pressed", String(goalsActive));
        state.activeRow = -1;
        if (projectsActive && refresh) await loadProjectManagement();
        if (goalsActive && refresh) await loadGoals(true);
      }

      function renderGoalList() {
        goalList.replaceChildren();
        if (!state.goals.length) {
          goalList.append(make("div", "empty", "还没有目标"));
          return;
        }
        state.goals.forEach((goal) => {
          const button = make("button", "goal-card" + (goal.id === state.selectedGoalId ? " selected" : ""));
          button.type = "button";
          button.append(make("span", "goal-card-name", goal.name));
          const meta = make("span", "goal-card-meta");
          meta.append(
            make("span", "status-pill status-" + goal.status, goal.status),
            make("span", "", String(goal.sessionCount) + " 条证据"),
            make("span", "", "最近 " + relativeTime(goal.lastActivityAt)),
          );
          button.append(meta);
          button.addEventListener("click", () => selectGoal(goal.id));
          goalList.append(button);
        });
      }

      async function loadGoals(withDetail) {
        state.goals = await api("/api/goals");
        if (!state.goals.some((goal) => goal.id === state.selectedGoalId)) {
          state.selectedGoalId = state.goals[0]?.id || "";
        }
        renderGoalList();
        if (!withDetail) return;
        if (state.selectedGoalId) await loadGoalDetail();
        else goalDetail.replaceChildren(make("div", "empty", "新建一个目标，把相关 session 作为证据连接起来。"));
      }

      async function selectGoal(id) {
        state.selectedGoalId = id;
        await setView("goals", false);
        renderGoalList();
        await loadGoalDetail();
      }

      function editorField(label, control) {
        const field = make("label", "field", label);
        field.append(control);
        return field;
      }

      function section(title, countText) {
        const wrapper = make("section", "goal-section");
        const header = make("header", "goal-section-head");
        header.append(make("h3", "", title), make("span", "", countText));
        wrapper.append(header);
        return wrapper;
      }

      function renderGoalDetail() {
        const detail = state.goalDetail;
        goalDetail.replaceChildren();
        if (!detail) {
          goalDetail.append(make("div", "empty", "目标不存在或尚未选择"));
          return;
        }

        const editor = make("form", "goal-editor");
        const name = make("input");
        name.value = detail.goal.name;
        name.required = true;
        name.maxLength = 160;
        const status = make("select");
        ["active", "done", "archived"].forEach((value) => status.append(new Option(value, value)));
        status.value = detail.goal.status;
        const externalRef = make("input");
        externalRef.value = detail.goal.externalRef || "";
        externalRef.placeholder = "可选：gtd:5 或备注";
        const save = make("button", "action primary", "保存");
        save.type = "submit";
        const remove = make("button", "action danger", "删除");
        remove.type = "button";
        remove.addEventListener("click", async () => {
          if (!window.confirm("确定删除这个目标及其全部证据连线？")) return;
          await api("/api/goals/" + encodeURIComponent(detail.goal.id), { method: "DELETE" });
          state.selectedGoalId = "";
          state.goalDetail = null;
          state.sessionEtag = "";
          await loadGoals(true);
          showToast("目标已删除");
        });
        editor.append(editorField("名称", name), editorField("状态", status), editorField("外部引用", externalRef), save, remove);
        editor.addEventListener("submit", async (event) => {
          event.preventDefault();
          save.disabled = true;
          try {
            await api("/api/goals/" + encodeURIComponent(detail.goal.id), jsonRequest("PATCH", {
              name: name.value, status: status.value, externalRef: externalRef.value || null,
            }));
            state.sessionEtag = "";
            await loadGoals(true);
            showToast("目标已保存");
          } catch (error) { showToast("保存失败：" + error.message); }
          finally { save.disabled = false; }
        });
        goalDetail.append(editor);

        const evidence = section("证据 · " + detail.sessions.length + " 条 session", "人工确认");
        if (!detail.sessions.length) {
          evidence.append(make("div", "empty", "还没有确认的 session"));
        } else {
          const list = make("div", "goal-session-list");
          detail.sessions.forEach((row) => {
            const element = sessionRow(row, projectFor(row.projectKey), false, {
              extraActions: [{
                label: "移除", className: "danger",
                run: (button) => removeGoalLink(detail.goal.id, row, button),
              }],
            });
            list.append(element);
          });
          evidence.append(list);
        }
        goalDetail.append(evidence);

        const suggestions = section("建议", detail.suggestions.length + " 条 · 零 token 启发式");
        if (!detail.suggestions.length) {
          suggestions.append(make("div", "empty", "暂无更多建议"));
        } else {
          const list = make("div", "goal-session-list");
          detail.suggestions.forEach((row) => {
            list.append(sessionRow(row, projectFor(row.projectKey), false, {
              reasons: row.reasons,
              extraActions: [
                { label: "确认", className: "primary", run: (button) => linkSession(detail.goal.id, row, "confirmed", true, button) },
                { label: "忽略", run: (button) => linkSession(detail.goal.id, row, "dismissed", true, button) },
              ],
            }));
          });
          suggestions.append(list);
        }
        goalDetail.append(suggestions);
      }

      async function loadGoalDetail() {
        if (!state.selectedGoalId) return;
        state.goalDetail = await api("/api/goals/" + encodeURIComponent(state.selectedGoalId));
        renderGoalDetail();
      }

      async function linkSession(goalId, row, kind, refreshDetail, button = null) {
        if (button) button.disabled = true;
        try {
          await api("/api/goals/" + encodeURIComponent(goalId) + "/links", jsonRequest("POST", {
            agent: row.agent, sid: row.sid, kind,
          }));
          state.sessionEtag = "";
          await loadGoals(false);
          if (refreshDetail || state.view === "goals") await loadGoalDetail();
          else if (state.query) await runSearch();
          else await loadList();
          showToast(kind === "confirmed" ? "已确认为目标证据" : "已忽略该建议");
        } catch (error) { showToast("更新连线失败：" + error.message); }
        finally { if (button) button.disabled = false; }
      }

      async function removeGoalLink(goalId, row, button) {
        button.disabled = true;
        try {
          const path = "/api/goals/" + encodeURIComponent(goalId) + "/links/"
            + encodeURIComponent(row.agent) + "/" + encodeURIComponent(row.sid);
          await api(path, { method: "DELETE" });
          state.sessionEtag = "";
          await loadGoals(false);
          await loadGoalDetail();
          showToast("证据已移除");
        } catch (error) { showToast("移除失败：" + error.message); }
        finally { button.disabled = false; }
      }

      async function loadProjectManagement() {
        const [projects, health] = await Promise.all([
          conditionalApi("/api/projects", state.projectEtag),
          api("/healthz"),
        ]);
        indexStatus.textContent = `索引更新于 ${relativeTime(health.indexedAt)}`;
        if (!projects.unchanged) {
          state.projects = projects.body;
          state.projectEtag = projects.etag;
          renderProjects();
        }
        renderProjectManagement();
      }

      async function loadList() {
        const requestId = ++state.requestId;
        const params = new URLSearchParams();
        if (state.selectedProject) params.set("project", state.selectedProject);
        params.set("includeLive", "0");
        if (state.liveOnly || state.showArchived) params.set("limit", String(LIVE_POOL_LIMIT));
        const [projects, sessions, worktrees, health, goals, live] = await Promise.all([
          conditionalApi("/api/projects", state.projectEtag),
          conditionalApi(`/api/sessions?${params}`, state.sessionEtag),
          conditionalApi("/api/worktrees", state.worktreeEtag),
          api("/healthz"),
          api("/api/goals"),
          conditionalApi("/api/live", state.liveEtag),
        ]);
        if (requestId !== state.requestId || state.query) return;
        indexStatus.textContent = `索引更新于 ${relativeTime(health.indexedAt)}`;
        state.goals = goals;
        const projectsChanged = !projects.unchanged;
        const sessionsChanged = !sessions.unchanged;
        const worktreesChanged = !worktrees.unchanged;
        const liveChanged = !live.unchanged;
        if (!projects.unchanged) {
          state.projects = projects.body;
          state.projectEtag = projects.etag;
        }
        if (!sessions.unchanged) {
          state.sourceSessions = sessions.body;
          state.sessionEtag = sessions.etag;
        }
        if (!worktrees.unchanged) {
          applyWorktreePreferences(worktrees.body);
          state.worktreeEtag = worktrees.etag;
        }
        if (!live.unchanged) {
          state.liveBySession = live.body;
          state.liveEtag = live.etag;
        }
        syncSessionLive();
        if (projectsChanged || worktreesChanged) renderProjects();
        if (projectsChanged) renderProjectManagement();
        if (projectsChanged || sessionsChanged || worktreesChanged || (liveChanged && state.liveOnly)) render();
        else if (liveChanged) patchSessionLive();
      }

      async function refreshLive() {
        const live = await conditionalApi("/api/live", state.liveEtag);
        if (live.unchanged) return;
        state.liveBySession = live.body;
        state.liveEtag = live.etag;
        syncSessionLive();
        if (state.liveOnly) render();
        else patchSessionLive();
      }

      async function runSearch() {
        const query = searchInput.value.trim();
        state.query = query;
        if (!query) { state.sessionEtag = ""; await loadList(); return; }
        const requestId = ++state.requestId;
        try {
          let rows = await api(`/api/search?q=${encodeURIComponent(query)}&includeLive=0&limit=200`);
          if (state.selectedProject) rows = rows.filter((row) => row.projectKey === state.selectedProject);
          if (requestId !== state.requestId || state.query !== query) return;
          state.sourceSessions = rows;
          syncSessionLive();
          render();
        } catch (error) { showToast(`搜索失败：${error.message}`); }
      }

      function selectProject(key) {
        state.selectedProject = key;
        state.sessionEtag = "";
        renderProjects();
        state.query ? runSearch() : loadList().catch((error) => showToast(error.message));
      }

      function setLiveOnly(value) {
        state.liveOnly = value;
        state.sessionEtag = "";
        allMode.setAttribute("aria-pressed", String(!value));
        liveMode.setAttribute("aria-pressed", String(value));
        state.query ? runSearch() : loadList().catch((error) => showToast(error.message));
      }

      async function setArchivedMode(value) {
        state.showArchived = value;
        state.selectedProject = "";
        state.sessionEtag = "";
        syncSessionLive();
        renderProjects();
        render();
        if (state.query) await runSearch();
        else await loadList();
      }

      function moveRow(delta) {
        const rows = [...document.querySelectorAll(".session-row")];
        if (!rows.length) return;
        rows[state.activeRow]?.classList.remove("keyboard-active");
        state.activeRow = (state.activeRow + delta + rows.length) % rows.length;
        rows[state.activeRow].classList.add("keyboard-active");
        rows[state.activeRow].focus();
        rows[state.activeRow].scrollIntoView({ block: "nearest" });
      }

      sessionsViewButton.addEventListener("click", async () => {
        await setView("sessions", false);
        state.sessionEtag = "";
        if (state.query) await runSearch();
        else await loadList();
      });
      projectsViewButton.addEventListener("click", () => {
        setView("projects").catch((error) => showToast("加载项目失败：" + error.message));
      });
      goalsViewButton.addEventListener("click", () => {
        setView("goals").catch((error) => showToast("加载目标失败：" + error.message));
      });
      newGoalButton.addEventListener("click", () => openGoalDialog());
      cancelGoal.addEventListener("click", () => goalDialog.close());
      goalDialog.addEventListener("close", () => { state.linkAfterCreate = null; });
      goalDialogForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const name = newGoalName.value.trim();
        if (!name) { newGoalName.focus(); return; }
        const submit = goalDialogForm.querySelector("[type=submit]");
        submit.disabled = true;
        const pending = state.linkAfterCreate;
        try {
          const created = await api("/api/goals", jsonRequest("POST", {
            name, externalRef: newGoalRef.value.trim() || null,
          }));
          if (pending) {
            await api("/api/goals/" + encodeURIComponent(created.id) + "/links", jsonRequest("POST", {
              agent: pending.agent, sid: pending.sid, kind: "confirmed",
            }));
          }
          state.selectedGoalId = created.id;
          state.sessionEtag = "";
          goalDialog.close();
          await setView("goals", false);
          await loadGoals(true);
          showToast(pending ? "目标已创建并连接证据" : "目标已创建");
        } catch (error) { showToast("创建失败：" + error.message); }
        finally { submit.disabled = false; }
      });

      searchInput.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(runSearch, SEARCH_DEBOUNCE_MS);
      });
      projectSearchInput.addEventListener("input", () => {
        state.projectQuery = projectSearchInput.value.trim();
        renderProjectManagement();
      });
      projectSummary.addEventListener("click", (event) => {
        const button = event.target.closest("[data-project-scope]");
        if (!button) return;
        state.projectScope = button.dataset.projectScope;
        renderProjectManagement();
      });
      mobileProject.addEventListener("change", () => selectProject(mobileProject.value));
      archivedProjects.addEventListener("click", () => setArchivedMode(!state.showArchived)
        .catch((error) => showToast(error.message)));
      mobileArchivedProjects.addEventListener("click", () => setArchivedMode(!state.showArchived)
        .catch((error) => showToast(error.message)));
      allMode.addEventListener("click", () => setLiveOnly(false));
      liveMode.addEventListener("click", () => setLiveOnly(true));
      document.addEventListener("keydown", (event) => {
        const typing = event.target instanceof HTMLInputElement || event.target instanceof HTMLSelectElement;
        if (event.key === "/" && !typing && state.view === "sessions") { event.preventDefault(); searchInput.focus(); return; }
        if (event.key === "/" && !typing && state.view === "projects") { event.preventDefault(); projectSearchInput.focus(); return; }
        if (typing) return;
        if (state.view !== "sessions") return;
        if (event.key === "ArrowDown" || event.key === "ArrowUp") { event.preventDefault(); moveRow(event.key === "ArrowDown" ? 1 : -1); return; }
        const row = document.querySelectorAll(".session-row")[state.activeRow];
        if (!row) return;
        if (event.key === "Enter") row.querySelector(".focus-action")?.click();
        if (event.key.toLowerCase() === "c") row.querySelector(".copy-action")?.click();
      });

      loadList().catch((error) => showToast(`加载失败：${error.message}`));
      setInterval(() => {
        if (state.view === "projects") {
          loadProjectManagement().catch((error) => showToast(error.message));
          return;
        }
        if (state.view !== "sessions") return;
        const refresh = state.query ? refreshLive() : loadList();
        refresh.catch((error) => showToast(error.message));
      }, POLL_MS);
    })();
  </script>
</body>
</html>
