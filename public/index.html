<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrcaTab · Agent 会话</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #F4F7F6; --surface: #FFFFFF; --text: #17222A; --muted: #5C6B75;
      --line: #D5DEE1; --accent: #0E6C75; --accent-soft: #E1F0F1; --hover: #EDF3F2;
      --busy: #B45309; --waiting: #B91C1C; --idle: #2F855A; --success-soft: #E6F4EC; --offline: #8A97A0;
      --resume: #9A4E0A; --resume-soft: #FFF0DC;
      --focus-ring: #0E6C75; --danger-soft: #FCE8E8; --shadow: #17222A1A;
      --topbar-height: 68px; --focus-monitor-gap: 16px; --focus-monitor-inset: 32px; --focus-monitor-width: 340px;
      --focus-monitor-dock-target-width: clamp(96px, 14vw, 180px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E1417; --surface: #151C21; --text: #E4E9EC; --muted: #93A1AB;
        --line: #263039; --accent: #62C6CD; --accent-soft: #18343A; --hover: #1C272D;
        --busy: #F5A524; --waiting: #F87171; --idle: #4ADE80; --success-soft: #173324; --offline: #6B7A85;
        --resume: #F5A524; --resume-soft: #3A2815;
        --focus-ring: #62C6CD; --danger-soft: #3A2024; --shadow: #00000040;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
    button, input, select { color: inherit; font: inherit; }
    button, select { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
    .topbar { position: sticky; z-index: 10; top: 0; display: flex; align-items: center; gap: 16px; min-height: 68px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 3px 14px var(--shadow); }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 145px; font-weight: 750; letter-spacing: -.02em; }
    .brand-mark { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 9px; background: var(--accent); color: var(--surface); }
    [hidden] { display: none !important; }
    .search-wrap { position: relative; flex: 1; max-width: 780px; }
    .search-wrap::before { position: absolute; top: 50%; left: 14px; color: var(--muted); content: "⌕"; font-size: 20px; transform: translateY(-52%); }
    #search { width: 100%; height: 42px; padding: 0 16px 0 42px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
    #search:focus { border-color: var(--accent); background: var(--surface); }
    .mode-switch { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
    .mode-switch button { padding: 7px 13px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); }
    .mode-switch button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 5px var(--shadow); font-weight: 650; }
    .top-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    #index-status { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .layout { display: grid; grid-template-columns: 245px minmax(0, 1fr); width: min(1420px, 100%); margin: 0 auto; }
    .sidebar { position: sticky; top: 68px; align-self: start; height: calc(100vh - 68px); padding: 24px 16px; border-right: 1px solid var(--line); }
    .sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 4px 12px 10px; }
    .sidebar h2 { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .archive-scope { padding: 4px 7px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 11px; }
    .archive-scope:hover, .archive-scope[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
    #project-list { display: grid; gap: 4px; }
    .project-item { position: relative; border-radius: 9px; }
    .project-item:hover { background: var(--hover); }
    .project-button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; width: 100%; min-width: 0; padding: 10px 38px 10px 10px; border: 0; border-radius: 9px; background: transparent; text-align: left; }
    .project-button.active { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
    .project-label { display: flex; min-width: 0; align-items: center; gap: 4px; }
    .project-button .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .project-working { display: inline-flex; height: 18px; flex: 0 0 auto; align-items: center; gap: 4px; padding: 0 6px; border: 1px solid transparent; border-radius: 999px; background: var(--resume-soft); color: var(--busy); font: 700 10px ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
    .project-working::before { width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 2px var(--surface); content: ""; }
    .project-control { min-width: 0; padding: 5px 6px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 11px; }
    .project-control:hover, .project-control.active { background: var(--surface); color: var(--accent); }
    .count { color: var(--muted); font-variant-numeric: tabular-nums; }
    main { min-width: 0; padding: 24px clamp(16px, 3vw, 44px) 60px; }
    .mobile-project-tools { display: none; gap: 8px; margin-bottom: 18px; }
    .mobile-project { display: none; width: 100%; height: 42px; margin-bottom: 18px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .group { margin-bottom: 30px; }
    .color-dot { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%; background: var(--project-color, var(--offline)); }
    .pin-indicator { display: inline-grid; width: 13px; height: 13px; flex: 0 0 13px; place-items: center; color: var(--accent); opacity: .62; }
    .pin-indicator svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.45; transform: rotate(-12deg); }
    :is(.project-item, .worktree-cluster, .managed-project):hover .pin-indicator { opacity: .92; }
    .worktree-stack { display: grid; gap: 15px; }
    .worktree-cluster { min-width: 0; }
    .worktree-header { display: flex; min-width: 0; align-items: center; gap: 9px; margin: 0 3px 10px; }
    .worktree-cluster.collapsed .worktree-header { margin-bottom: 0; }
    .worktree-toggle { display: grid; width: 20px; height: 20px; min-width: 20px; padding: 0; border: 0; border-radius: 5px; place-items: center; background: transparent; color: var(--muted); }
    .worktree-toggle:hover { background: var(--hover); color: var(--accent); }
    .worktree-toggle::before { width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; content: ""; transform: translateY(-1px) rotate(45deg); }
    .worktree-toggle[aria-expanded="false"]::before { transform: translateX(-1px) rotate(-45deg); }
    .worktree-title { display: flex; min-width: 0; flex: 0 1 auto; align-items: center; gap: 4px; }
    .worktree-name { max-width: 280px; min-width: 0; flex: 0 1 auto; overflow: hidden; margin: 0; font: 700 16px ui-monospace, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .worktree-kind { flex: 0 0 auto; padding: 2px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 10px; font-weight: 650; }
    .worktree-path { min-width: 0; flex: 1 1 160px; overflow: hidden; color: var(--muted); font: 11px ui-monospace, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .worktree-meta { flex: 0 0 auto; color: var(--muted); font-size: 12px; }
    .worktree-focus { flex: 0 0 auto; min-width: 0; padding: 5px 9px; background: transparent; font-size: 12px; }
    .worktree-pin, .worktree-archive { min-width: 0; padding: 6px 8px; border-color: transparent; background: transparent; color: var(--muted); font-size: 11px; text-align: left; }
    .worktree-pin:hover, .worktree-pin.active { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
    .worktree-archive:hover { border-color: var(--waiting); color: var(--waiting); }
    .worktree-archive.restore { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
    .session-list { overflow: visible; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: 0 6px 24px var(--shadow); }
    .session-row { display: grid; grid-template-columns: 12px minmax(180px, 1fr) minmax(90px, auto) auto auto; gap: 12px; align-items: center; min-height: 72px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .session-row:last-child { border-bottom: 0; }
    .session-row:hover, .session-row.keyboard-active { background: var(--hover); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--offline); box-shadow: 0 0 0 3px var(--bg); }
    .status-dot[data-state="working"], .status-dot[data-state="busy"] { background: var(--busy); }
    .status-dot[data-state="waiting"] { background: var(--waiting); }
    .status-dot[data-state="done"], .status-dot[data-state="idle"], .status-dot[data-state="shell"] { background: var(--idle); }
    .session-main { min-width: 0; }
    .session-title-line { display: flex; min-width: 0; align-items: center; gap: 7px; }
    .session-title { min-width: 0; overflow: hidden; font-size: 15px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .agent-badge { flex: 0 0 auto; padding: 2px 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--muted); font: 10px ui-monospace, Menlo, monospace; letter-spacing: .02em; }
    .agent-claude { border-color: #d68a56; color: #a95d2e; }
    .agent-codex { border-color: #6b9bd2; color: #3d72ad; }
    .agent-hermes { border-color: #8c78c6; color: #674da8; }
    .live-state { max-width: 150px; flex: 0 0 auto; overflow: hidden; padding: 2px 6px; border-radius: 999px; background: var(--bg); color: var(--muted); font: 10px ui-monospace, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .live-state[data-state="working"], .live-state[data-state="busy"] { background: var(--resume-soft); color: var(--busy); }
    .live-state[data-state="waiting"] { background: var(--danger-soft); color: var(--waiting); }
    .live-state[data-state="done"] { background: var(--accent-soft); color: var(--accent); }
    .row-last-input { overflow: hidden; margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .hits { display: grid; gap: 3px; margin-top: 7px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .hit { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hit strong { color: var(--accent); font-weight: 750; }
    .chips { display: flex; max-width: 360px; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .chip { max-width: 160px; overflow: hidden; padding: 4px 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font: 11px ui-monospace, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
    button.goal-chip { background: var(--accent-soft); color: var(--accent); font-family: inherit; }
    button.goal-chip:hover { border-color: var(--accent); }
    .reason-chip { background: var(--bg); color: var(--accent); font-family: inherit; }
    .facts { display: grid; min-width: 92px; justify-items: end; gap: 4px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .actions { display: flex; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .action { min-width: 62px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); white-space: nowrap; }
    .action:hover { border-color: var(--accent); color: var(--accent); }
    .action.primary { border-color: var(--accent); background: var(--accent); color: var(--surface); }
    .action.danger { border-color: transparent; background: var(--danger-soft); color: var(--waiting); }
    .focus-action { min-width: 48px; padding: 5px 8px; border-radius: 7px; font-size: 12px; font-weight: 700; }
    .focus-jump { border-color: var(--accent); background: var(--accent); color: var(--surface); }
    .focus-jump:hover { border-color: var(--accent); color: var(--surface); filter: brightness(.95); }
    .focus-resume { border-color: var(--resume); background: var(--resume-soft); color: var(--resume); }
    .focus-resume:hover { border-color: var(--resume); color: var(--resume); filter: brightness(.96); }
    .session-send { --session-send-height: 36px; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-column: 2 / -1; min-width: 0; height: var(--session-send-height); overflow: hidden; margin-top: 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); transition: border-color .12s ease, box-shadow .12s ease, background .12s ease; }
    .session-send:focus-within { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 2px var(--accent-soft); }
    .session-send-input { width: 100%; min-width: 0; height: 100%; padding: 0 11px; border: 0; border-radius: 0; appearance: none; background: transparent; color: var(--text); font: 12px/1.2 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
    .session-send-input:focus { outline: none; }
    .session-send-input::placeholder { color: var(--muted); opacity: .82; }
    .session-send-button { display: grid; min-width: 60px; height: 100%; padding: 0 13px; border: 0; border-left: 1px solid var(--accent); border-radius: 0; appearance: none; place-items: center; background: var(--accent); color: var(--surface); cursor: pointer; font-size: 12px; font-weight: 700; line-height: 1; }
    .session-send-button:hover { filter: brightness(.96); }
    .session-send-button:focus-visible { outline: 2px solid var(--surface); outline-offset: -4px; }
    .session-send-button:disabled { cursor: wait; opacity: .62; }
    .session-send-note { display: flex; grid-column: 2 / -1; min-width: 0; align-items: center; gap: 4px; margin-top: 5px; color: var(--muted); font-size: 11px; }
    .session-send-state, .session-send-icon-button { display: grid; flex: 0 0 auto; padding: 0; border-radius: 6px; place-items: center; }
    .session-send-state { width: 20px; height: 20px; background: var(--bg); color: var(--muted); }
    .session-send-state svg, .session-send-icon-button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .session-send-note[data-state="verifying"] .session-send-state { background: var(--resume-soft); color: var(--busy); }
    .session-send-note[data-state="verifying"] .session-send-state svg { animation: session-send-spin .9s linear infinite; }
    .session-send-note[data-state="confirmed"] .session-send-state { background: var(--success-soft); color: var(--idle); }
    .session-send-note:is([data-state="stalled"], [data-state="failed"]) .session-send-state { background: var(--danger-soft); color: var(--waiting); }
    .session-send-text { min-width: 0; overflow: hidden; flex: 1; text-overflow: ellipsis; white-space: nowrap; }
    .session-send-icon-button { width: 24px; height: 24px; border: 1px solid transparent; background: transparent; color: var(--muted); }
    .session-send-icon-button:hover { background: var(--hover); }
    .session-send-copy:hover { color: var(--accent); }
    .session-send-dismiss:hover { color: var(--muted); }
    .session-send-icon-button:focus-visible { outline-width: 2px; outline-offset: 0; }
    @keyframes session-send-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .session-send-note[data-state="verifying"] .session-send-state svg { animation: none; }
    }
    .focus-session-card .session-send { --session-send-height: 32px; margin-top: 5px; border-radius: 8px; }
    .focus-session-card .session-send-input { padding-inline: 8px; font-size: 11px; }
    .focus-session-card .session-send-button { min-width: 48px; padding-inline: 9px; font-size: 11px; }
    .session-tasks { display: grid; grid-column: 2 / -1; gap: 5px; margin-top: 8px; }
    .session-task { display: flex; min-width: 0; align-items: center; gap: 7px; font-size: 12px; }
    .session-task-dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 999px; background: var(--busy); }
    .session-task[data-kind="done"] .session-task-dot { background: var(--muted); }
    .session-task-number { flex: 0 0 auto; padding: 1px 6px; border-radius: 999px; background: var(--bg); color: var(--muted); font: 10px ui-monospace, Menlo, monospace; }
    .session-task-title { min-width: 0; overflow: hidden; flex: 1; text-overflow: ellipsis; white-space: nowrap; }
    .session-task[data-kind="done"] .session-task-title { color: var(--muted); text-decoration: line-through; }
    .session-task .action { min-width: 0; padding: 3px 7px; border-radius: 6px; font-size: 11px; }
    .session-task-open { display: inline-flex; align-items: center; text-decoration: none; }
    .session-capture { display: flex; grid-column: 2 / -1; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 6px; }
    .session-capture-row { display: flex; grid-column: 2 / -1; margin-top: 6px; }
    .session-capture-input { min-width: 120px; flex: 1; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 12px; }
    .session-capture-input:focus { border-color: var(--accent); outline: none; }
    .session-capture-button { min-width: 54px; border-color: var(--accent); background: var(--accent); color: var(--surface); font-weight: 700; }
    .session-capture-button:disabled { cursor: wait; opacity: .62; }
    .session-capture-open, .session-capture-target, .session-capture-cancel { padding: 3px 8px; font-size: 11px; }
    .session-capture-target { max-width: 240px; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .session-capture-picker { min-width: 0; max-width: 240px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 11px; }
    .focus-session-card .session-capture-input { padding: 5px 8px; font-size: 11px; }
    .focus-session-card .session-capture-button { min-width: 44px; padding: 5px 7px; font-size: 11px; }
    .floating-menu { position: relative; min-width: 0; flex: 0 0 auto; }
    .floating-menu-toggle { cursor: pointer; list-style: none; user-select: none; }
    .floating-menu-toggle::-webkit-details-marker { display: none; }
    .floating-menu:not([open]) > .floating-menu-panel { display: none; }
    .floating-menu[open] { z-index: 40; }
    .floating-menu[open] > .floating-menu-toggle { border-color: var(--accent); color: var(--accent); }
    .floating-menu-panel { position: absolute; z-index: 40; top: calc(100% + 6px); right: 0; display: grid; width: max-content; max-width: calc(100vw - 16px); min-width: 132px; gap: 4px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: 0 12px 32px #17222A2E; transform: translateX(var(--floating-menu-shift-x, 0)); }
    .floating-menu.open-up > .floating-menu-panel { top: auto; bottom: calc(100% + 6px); }
    .floating-menu-action { width: 100%; min-width: 0; text-align: left; }
    .menu-open { position: relative; z-index: 35; }
    .project-item-menu { position: absolute; z-index: 2; top: 50%; right: 5px; opacity: 0; transform: translateY(-50%); transition: opacity .12s ease; pointer-events: none; }
    .project-item:hover .project-item-menu, .project-item:focus-within .project-item-menu, .project-item-menu[open] { opacity: 1; pointer-events: auto; }
    .project-menu-toggle { display: grid; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; place-items: center; background: var(--surface); color: var(--muted); font-size: 16px; line-height: 1; }
    .project-item-menu .floating-menu-panel { top: calc(100% + 5px); }
    .compact-menu-toggle { display: flex; min-width: 54px; align-items: center; justify-content: center; gap: 4px; padding: 5px 8px; color: var(--muted); font-size: 12px; }
    .compact-menu-toggle::after { content: "⌄"; font-size: 11px; transition: transform .12s ease; }
    .floating-menu[open] > .compact-menu-toggle::after { transform: rotate(180deg); }
    .action-drawer { min-width: 0; }
    .drawer-toggle { display: flex; min-width: 54px; align-items: center; justify-content: center; gap: 4px; padding: 5px 8px; color: var(--muted); font-size: 12px; list-style: none; }
    .drawer-toggle::after { content: "⌄"; font-size: 11px; transition: transform .12s ease; }
    .action-drawer[open] .drawer-toggle::after { transform: rotate(180deg); }
    .drawer-action { min-width: 112px; padding: 6px 8px; border-color: transparent; background: transparent; font-size: 11px; }
    .resource-drawer .floating-menu-panel { width: min(420px, calc(100vw - 16px)); min-width: 300px; gap: 8px; padding: 9px; }
    .resource-card { display: grid; gap: 7px; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
    .resource-card-head { display: flex; min-width: 0; align-items: baseline; justify-content: space-between; gap: 12px; }
    .resource-app { overflow: hidden; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .resource-port { flex: 0 0 auto; color: var(--muted); font: 11px ui-monospace, Menlo, monospace; }
    .resource-links { display: flex; flex-wrap: wrap; gap: 6px; }
    .resource-link { display: inline-flex; min-width: 0; align-items: center; gap: 5px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; color: var(--accent); font-size: 11px; text-decoration: none; }
    .resource-link:hover { border-color: var(--accent); background: var(--accent-soft); }
    .resource-status { color: var(--muted); font: 10px ui-monospace, Menlo, monospace; }
    .goal-picker { width: 112px; padding: 7px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

        recentInputsHasMoreBySession: {}, recentInputsLoadingBySession: {},
        recentInputsIdentitySignature: "", recentInputsSupported: true, focusMonitorSessionKey: "",

      const searchInput = document.querySelector("#search");

      const focusMonitorDockRight = document.querySelector("#focus-monitor-dock-right");

      focusProjectSort.value = state.focusProjectSort;

      const projectsView = document.querySelector("#projects-view");

      const projectScopeTitle = document.querySelector("#project-scope-title");
      const archivedProjects = document.querySelector("#archived-projects");
      const mobileArchivedProjects = document.querySelector("#mobile-archived-projects");

      const toast = document.querySelector("#toast");
      let searchTimer = 0;

      async function api(path, options) {
        const response = await fetch(path, options);
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        return body;
      }

      async function conditionalApi(path, etag) {
        const headers = etag ? { "If-None-Match": etag } : {};
        const response = await fetch(path, { headers });
        if (response.status === 304) return { unchanged: true, etag };
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        return { unchanged: false, etag: response.headers.get("ETag") || "", body };
      }

      async function optionalConditionalApi(path, etag, fallback) {
        const headers = etag ? { "If-None-Match": etag } : {};
        const response = await fetch(path, { headers });
        if (response.status === 304) return { unchanged: true, etag };
        if (response.status === 404) {
          return { unchanged: false, etag: "", body: fallback, unsupported: true };
        }
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        return { unchanged: false, etag: response.headers.get("ETag") || "", body };
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("visible"), RESULT_RESET_MS);
      }

      function basename(path) {
        return path ? path.replace(/\/+$/, "").split("/").pop() || path : "";
      }

      function relativeTime(timestamp) {
        if (timestamp == null) return "无时间";
        const minutes = Math.max(0, Math.floor((Date.now() - timestamp) / 60000));
        if (minutes < 1) return "刚刚";
        if (minutes < 60) return `${minutes} 分钟前`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours} 小时前`;
        return `${Math.floor(hours / 24)} 天前`;
      }


      function focusInputText(value) {
        return String(value || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
      }

      function focusInputTime(timestamp) {
        if (timestamp === null || timestamp === undefined || timestamp === "") return "";
        const numeric = Number(timestamp);
        if (!Number.isFinite(numeric)) return "";
        const date = new Date(numeric);
        if (Number.isNaN(date.getTime())) return "";
        return date.toLocaleString("zh-CN", {
          month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false,
        });
      }

      function focusMonitorInputs(row) {
        const key = sessionKey(row);
        const values = state.recentInputsBySession[key] || [];
        const timestamps = state.recentInputTimesBySession[key] || [];
        return values.map((value, index) => {
          const record = typeof value === "object" && value !== null ? value : { text: value, ts: timestamps[index] };
          const numericTimestamp = record.ts === null || record.ts === undefined ? null : Number(record.ts);
          return {
            text: focusInputText(record.text),
            ts: Number.isFinite(numericTimestamp) ? numericTimestamp : null,
          };
        }).filter(({ text }) => text);
      }

      function projectFor(key) {
        if (key === UNINDEXED_LIVE_PROJECT_KEY) {
          return { key, name: "未索引在线会话", root: "", color: null, pinned: false, archived: false };
        }
        return state.projects.find((project) => project.key === key)
          || { key, name: basename(key) || "未知", root: "", color: null, pinned: false, archived: false };
      }

      function orderedProjectKeys(groups) {
        const ordered = state.projects.map((project) => project.key).filter((key) => groups.has(key));
        groups.forEach((_rows, key) => { if (!ordered.includes(key)) ordered.push(key); });
        if (groups.has(UNINDEXED_LIVE_PROJECT_KEY)) {
          ordered.splice(ordered.indexOf(UNINDEXED_LIVE_PROJECT_KEY), 1);
          ordered.unshift(UNINDEXED_LIVE_PROJECT_KEY);
        }
        return ordered;
      }

      function focusProjectLatest(rows) {
        return rows.reduce((latest, row) => Math.max(latest, row.live?.updatedAt || 0), 0);
      }

      function compareFocusProjectNames(leftKey, rightKey, direction = 1) {
        const left = projectFor(leftKey);
        const right = projectFor(rightKey);
        return direction * (
          FOCUS_PROJECT_NAME_COLLATOR.compare(left.name, right.name)
          || left.key.localeCompare(right.key)
        );
      }

      function orderedFocusProjectKeys(groups) {
        return [...groups.keys()].sort((leftKey, rightKey) => {
          if (leftKey === UNINDEXED_LIVE_PROJECT_KEY) return -1;
          if (rightKey === UNINDEXED_LIVE_PROJECT_KEY) return 1;
          const pinOrder = Number(Boolean(projectFor(rightKey).pinned))
            - Number(Boolean(projectFor(leftKey).pinned));
          if (pinOrder) return pinOrder;
          if (state.focusProjectSort === "recent") {
            const activityOrder = focusProjectLatest(groups.get(rightKey))
              - focusProjectLatest(groups.get(leftKey));
            if (activityOrder) return activityOrder;
          }
          return compareFocusProjectNames(leftKey, rightKey, state.focusProjectSort === "za" ? -1 : 1);
        });
      }

      function visibleProjects() {
        if (!state.showArchived) return state.projects.filter((project) => !project.archived);
        const projectKeys = new Set([...state.worktreePreferences.values()]
          .filter((preference) => preference.archived)
          .map((preference) => preference.projectKey));
        return state.projects.filter((project) => project.archived || projectKeys.has(project.key));
      }

      function worktreeRootFor(row, project = projectFor(row.projectKey)) {
        return row.worktreeRoot || row.cwd || project.root || "";
      }

      function applyWorktreePreferences(preferences) {
        state.worktreePreferences = new Map(preferences.map((preference) => [preference.root, preference]));
      }

      function applyWorktreeResources(snapshot) {
        state.worktreeResources = new Map(Object.entries(snapshot?.resources || {}));
      }

      function groupedWorktrees(rows, project, activityAt = (row) => row.lastInputAt || 0) {
        const groups = new Map();
        rows.forEach((row) => {
          const root = worktreeRootFor(row, project);
          const key = root || "__unknown_worktree__";
          const preference = state.worktreePreferences.get(root);
          const group = groups.get(key) || { root, detected: false, pinned: false, latest: 0, rows: [] };
          group.detected ||= Boolean(row.worktreeRoot);
          group.pinned ||= Boolean(preference?.pinned);
          group.latest = Math.max(group.latest, activityAt(row) || 0);
          group.rows.push(row);
          groups.set(key, group);
        });
        return [...groups.values()].sort((a, b) => Number(b.pinned) - Number(a.pinned)
          || b.latest - a.latest || a.root.localeCompare(b.root));
      }

      function worktreeKind(group, project) {
        if (project.key === UNINDEXED_LIVE_PROJECT_KEY) return "未索引";
        if (!group.detected) return "工作目录";
        return group.root === project.root ? "主 worktree" : "关联 worktree";
      }

      function sessionKey(row) { return `${row.agent}/${row.sid}`; }

      function unindexedLiveRows(indexedKeys) {
        return Object.entries(state.liveBySession).flatMap(([key, live]) => {
          if (indexedKeys.has(key)) return [];
          const separator = key.indexOf("/");
          const agent = key.slice(0, separator);
          const sid = key.slice(separator + 1);
          if (separator < 1 || !SESSION_AGENTS.has(agent) || !sid) return [];
          return [{
            agent, sid, projectKey: UNINDEXED_LIVE_PROJECT_KEY, cwd: null, worktreeRoot: null,
            branch: null, title: null, firstPrompt: null, lastPrompt: live.name || null,
            displayTitle: "未索引在线会话", lastInputAt: null, promptCount: 0,
            live, goals: [], indexed: false,
          }];
        });
      }

      function rawLiveState(live) {
        return typeof live?.status === "string" && live.status ? live.status : "unknown";
      }

      function projectWorkingCount(projectKey) {
        return Object.values(state.liveBySession)
          .filter((live) => live.projectKey === projectKey && live.status === "working").length;
      }

      function projectWorkingIndicator(projectKey) {
        const count = projectWorkingCount(projectKey);
        if (!count) return null;
        const indicator = make("span", "project-working", String(count));
        const label = `${count} 个进行中的会话`;
        indicator.setAttribute("aria-label", label);
        indicator.title = label;
        return indicator;
      }

      function liveStateText(live) {
        const status = rawLiveState(live);
        if (status === "working") return "进行中";
        if (status === "done") return "已就绪";
        if (status === "waiting") return "需操作";
        if (status === "blocked") return "已受阻";
        if (status === "idle") return "空闲";
        if (status === "busy") return "忙碌";
        if (status === "shell") return "终端中";
        if (status === "error") return "异常";
        if (status === "unknown") return "状态未知";
        return "其他状态";
      }

      function updateLivePresentation(dot, badge, live) {
        const status = live ? rawLiveState(live) : "offline";
        const label = live ? liveStateText(live) : "离线";
        const title = live
          ? [label, live.name].filter(Boolean).join(" · ")
          : label;
        dot.dataset.state = status;
        dot.title = title;
        badge.hidden = !live;
        badge.dataset.state = status;
        badge.textContent = live ? label : "";
        badge.title = title;
      }

      function syncSessionLive() {
        state.sourceSessions.forEach((row) => { row.live = state.liveBySession[sessionKey(row)] || null; });
        const indexedKeys = new Set(state.sourceSessions.map(sessionKey));
        const unindexed = !state.selectedProject && !state.query ? unindexedLiveRows(indexedKeys) : [];
        const combined = [...unindexed, ...state.sourceSessions];
        const scoped = combined.filter((row) => {
          const project = projectFor(row.projectKey);
          const worktreeArchived = Boolean(state.worktreePreferences.get(worktreeRootFor(row, project))?.archived);
          return state.showArchived
            ? project.archived || (!project.archived && worktreeArchived)
            : !project.archived && !worktreeArchived;
        });
        const rows = state.liveOnly ? scoped.filter((row) => row.live) : scoped;
        state.sessions = rows.slice(0, VISIBLE_SESSION_LIMIT);
      }

      function make(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text != null) element.textContent = text;
        return element;
      }

      function lineIcon(name) {
        const paths = {
          check: "M5 12.5l4.25 4L19 7",
          clock: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7v5l3 2",
          copy: "M9 8h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h1",
          spinner: "M20 12a8 8 0 1 1-2.34-5.66",
          x: "M7 7l10 10M17 7L7 17",
        };
        const svg = document.createElementNS(SVG_NAMESPACE, "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("aria-hidden", "true");
        const path = document.createElementNS(SVG_NAMESPACE, "path");
        path.setAttribute("d", paths[name] || paths.clock);

      function loadStoredStringSet(storageKey, label) {
        try {
          const stored = JSON.parse(localStorage.getItem(storageKey) || "[]");
          if (!Array.isArray(stored)) throw new Error("stored value is not an array");
          return new Set(stored.filter((value) => typeof value === "string" && value));
        } catch (error) {
          console.warn(`Unable to load ${label}`, error);
          return new Set();
        }
      }

      function saveStoredStringSet(storageKey, label, values) {
        try {
          localStorage.setItem(storageKey, JSON.stringify([...values].sort()));
        } catch (error) {
          console.warn(`Unable to save ${label}`, error);
        }
      }

      function loadFocusProjectSort() {
        try {
          const value = localStorage.getItem(FOCUS_PROJECT_SORT_STORAGE_KEY) || "az";
          return FOCUS_PROJECT_SORT_MODES.has(value) ? value : "az";
        } catch (error) {
          console.warn("Unable to load Focus project sort", error);
          return "az";
        }
      }

      function setFocusProjectSort(value) {
        if (!FOCUS_PROJECT_SORT_MODES.has(value) || value === state.focusProjectSort) return;
        state.focusProjectSort = value;
        try {
          localStorage.setItem(FOCUS_PROJECT_SORT_STORAGE_KEY, value);

          console.warn("Unable to save Focus project sort", error);

        renderFocus();

      function loadCollapsedWorktrees() {
        return loadStoredStringSet(COLLAPSED_WORKTREES_STORAGE_KEY, "collapsed worktrees");
      }

      function saveCollapsedWorktrees(collapsedWorktrees) {
        saveStoredStringSet(COLLAPSED_WORKTREES_STORAGE_KEY, "collapsed worktrees", collapsedWorktrees);
      }

      function defaultFocusMonitorPlacement() {
        return { mode: "floating", left: null, top: null };
      }

      function loadFocusMonitorPlacement() {
        try {
          const raw = localStorage.getItem(FOCUS_MONITOR_PLACEMENT_STORAGE_KEY);
          if (!raw) return defaultFocusMonitorPlacement();
          const stored = JSON.parse(raw);
          if (stored?.mode === "left" || stored?.mode === "right") return { mode: stored.mode };
          if (stored?.mode !== "floating") throw new Error("unknown placement mode");
          if (Number.isFinite(stored.left) && Number.isFinite(stored.top)) {
            return { mode: "floating", left: stored.left, top: stored.top };
          }
          return defaultFocusMonitorPlacement();
        } catch (error) {
          console.warn("Unable to load Focus Monitor placement", error);
          return defaultFocusMonitorPlacement();
        }
      }

      function saveFocusMonitorPlacement(placement) {
        try {
          localStorage.setItem(FOCUS_MONITOR_PLACEMENT_STORAGE_KEY, JSON.stringify(placement));
        } catch (error) {
          console.warn("Unable to save Focus Monitor placement", error);
        }
      }

      function setWorktreeCollapsed(root, collapsed) {
        const next = new Set(state.collapsedWorktrees);
        if (collapsed) next.add(root);
        else next.delete(root);
        state.collapsedWorktrees = next;
        saveCollapsedWorktrees(next);
        render();
      }

      function focusProjectCollapseKey(laneKey, projectKey) {
