        saveStoredStringSet(FOCUS_COLLAPSED_WORKTREES_STORAGE_KEY, "Focus worktrees", next);
        renderFocus();
      }

      function closeFloatingMenus(except = null) {
        let closed = false;
        document.querySelectorAll(".floating-menu[open]").forEach((menu) => {
          if (menu === except) return;
          menu.removeAttribute("open");
          closed = true;
        });
        return closed;
      }

      function positionFloatingMenu(menu, panel) {
        menu.classList.remove("open-up");
        panel.style.removeProperty("--floating-menu-shift-x");
        let panelRect = panel.getBoundingClientRect();
        let shiftX = 0;
        if (panelRect.left < FLOATING_MENU_VIEWPORT_GAP) shiftX += FLOATING_MENU_VIEWPORT_GAP - panelRect.left;
        if (panelRect.right + shiftX > window.innerWidth - FLOATING_MENU_VIEWPORT_GAP) {
          shiftX -= panelRect.right + shiftX - (window.innerWidth - FLOATING_MENU_VIEWPORT_GAP);
        }
        if (shiftX) {
          panel.style.setProperty("--floating-menu-shift-x", `${shiftX}px`);
          panelRect = panel.getBoundingClientRect();
        }
        const menuRect = menu.getBoundingClientRect();
        const shouldOpenUp = panelRect.bottom > window.innerHeight - FLOATING_MENU_VIEWPORT_GAP
          && menuRect.top > panelRect.height + FLOATING_MENU_VIEWPORT_GAP;
        menu.classList.toggle("open-up", shouldOpenUp);
      }

      function floatingMenu(ariaLabel, className, toggleClass, label = "更多") {
        const menu = make("details", `floating-menu ${className}`.trim());
        const toggle = make("summary", `floating-menu-toggle ${toggleClass}`.trim(), label);
        const panel = make("div", "floating-menu-panel");
        toggle.setAttribute("aria-label", ariaLabel);
        toggle.title = ariaLabel;
        menu.append(toggle, panel);
        menu.addEventListener("toggle", () => {
          const host = menu.closest(".session-row, .project-item, .managed-project, .worktree-header");
          host?.classList.toggle("menu-open", menu.open);
          if (!menu.open) {
            menu.classList.remove("open-up");
            panel.style.removeProperty("--floating-menu-shift-x");
            return;
          }
          closeFloatingMenus(menu);
          requestAnimationFrame(() => {
            requestAnimationFrame(() => { if (menu.open) positionFloatingMenu(menu, panel); });
          });
        });
        panel.addEventListener("click", (event) => {
          if (event.target instanceof Element && event.target.closest("button")) menu.open = false;
        });
        return { menu, panel };
      }

      function appendHighlighted(parent, snippet) {
        let remaining = snippet;
        while (remaining) {
          const start = remaining.indexOf("‹");
          const end = start < 0 ? -1 : remaining.indexOf("›", start + 1);
          if (start < 0 || end < 0) { parent.append(document.createTextNode(remaining)); return; }
          parent.append(document.createTextNode(remaining.slice(0, start)));
          parent.append(make("strong", "", remaining.slice(start + 1, end)));
          remaining = remaining.slice(end + 1);
        }
      }

      async function copyText(text, message) {
        try { await navigator.clipboard.writeText(text); showToast(message); }
        catch (error) { showToast(`复制失败：${error.message}`); }
      }

      function renderManual(rowElement, result) {
        rowElement.querySelector(".manual")?.remove();
        const panel = make("div", "manual");
        if (result.command) {
          panel.append(make("code", "", result.command));
          const button = make("button", "action", "复制命令");
          button.type = "button";
          button.addEventListener("click", () => copyText(result.command, "已复制命令"));
          panel.append(button);
        } else {
          panel.textContent = result.reason === "running-outside-orca" ? "该会话正在 Orca 外运行，无法重复恢复。" : `需要手动处理：${result.reason}`;
        }
        rowElement.append(panel);
      }

      async function focusSession(row, button, rowElement) {
        const defaultLabel = () => row.live ? "跳转" : "恢复";
        button.disabled = true;
        button.textContent = "处理中…";
        try {
          const result = await api(`/api/focus/${encodeURIComponent(row.agent)}/${encodeURIComponent(row.sid)}`, { method: "POST" });
          if (result.action === "switched") {
            button.textContent = "已切到 tab";
            setTimeout(() => { button.textContent = defaultLabel(); }, RESULT_RESET_MS);
          } else if (result.action === "resumed") {
            button.textContent = "已在 Orca 恢复";
            setTimeout(() => { button.textContent = defaultLabel(); }, RESULT_RESET_MS);
          } else {
            button.textContent = defaultLabel();
            renderManual(rowElement, result);
          }
        } catch (error) {
          button.textContent = defaultLabel();
          showToast(`跳转失败：${error.message}`);
        } finally { button.disabled = false; }
      }

      async function focusProject(project, button) {
        const original = "回到 Orca";
        button.disabled = true;
        button.textContent = "切换中…";
        try {
          const result = await api("/api/projects/focus", jsonRequest("POST", { projectKey: project.key }));
          if (result.action === "switched") {
            button.textContent = "已切回";
            showToast(`已切回 Orca · ${project.name}`);
            setTimeout(() => { button.textContent = original; }, RESULT_RESET_MS);
          } else {
            button.textContent = original;
            showToast("该 worktree 没有可切回的 Orca 终端");
          }
        } catch (error) {
          button.textContent = original;
          showToast(`切换失败：${error.message}`);
        } finally { button.disabled = false; }
      }

      async function focusWorktreeSession(row, worktreeName, button) {
        const original = "回到 Orca";
        button.disabled = true;
        button.textContent = "切换中…";
        try {
          const result = await api(`/api/focus/${encodeURIComponent(row.agent)}/${encodeURIComponent(row.sid)}`, { method: "POST" });
          if (result.action === "switched" || result.action === "resumed") {
            button.textContent = "已切回";
            showToast(`已切回 ${worktreeName} · ${row.displayTitle}`);
            setTimeout(() => { button.textContent = original; }, RESULT_RESET_MS);
          } else {
            button.textContent = original;
            showToast("无法自动回到该 worktree 的第一个会话");
          }
        } catch (error) {
          button.textContent = original;
          showToast(`切换失败：${error.message}`);
        } finally { button.disabled = false; }
      }

      function canSendInput(row) {
        return Boolean(state.sendSupported && row.live && row.live.handle && rawLiveState(row.live) === "done");
      }

      function sendPath(row) {
        return `/api/session-send/${encodeURIComponent(row.agent)}/${encodeURIComponent(row.sid)}`;
      }

      function sendInputElement(key) {
        return document.querySelector(`.session-send[data-send-key="${CSS.escape(key)}"] .session-send-input`);
      }

      function activeSendFocus() {
        const active = document.activeElement;
        const form = active && active.closest ? active.closest(".session-send") : null;
        if (!form || !form.dataset.sendKey) return null;
        const caret = typeof active.selectionStart === "number" ? active.selectionStart : null;
        return { key: form.dataset.sendKey, caret };
      }

      function restoreSendFocus(previous) {
        if (!previous) return;
        const input = sendInputElement(previous.key);
        if (!input) return;
        input.focus();
        if (previous.caret !== null) input.setSelectionRange(previous.caret, previous.caret);
      }

      function finishSendComposition(key) {
        if (state.sendCompositionKey === key) state.sendCompositionKey = "";
        if (!state.sendRenderPending) return;
        state.sendRenderPending = false;
        requestAnimationFrame(renderCurrentView);
      }

      function renderCurrentView() {
        if (state.view === "focus") renderFocus();
        else render();
      }

      function registerSendConfirmation(entry) {
        const key = sessionKey(entry);
        const signature = `${entry.sentAt || 0}:${entry.confirmedAt || 0}`;
        if (state.sendConfirmationSeen[key] === signature) return;
        state.sendConfirmationSeen[key] = signature;
        const flash = { ...entry, state: "confirmed" };
        state.sendConfirmationFlashes[key] = flash;
        setTimeout(() => {
          const current = state.sendConfirmationFlashes[key];
          if (!current || current.sentAt !== flash.sentAt) return;
          delete state.sendConfirmationFlashes[key];
          if (state.sendRecords[key]?.state === "confirmed"
            && state.sendRecords[key].sentAt === flash.sentAt) delete state.sendRecords[key];
          state.sendRecordsSignature = "";
          renderCurrentView();
        }, SEND_CONFIRMATION_FEEDBACK_MS);
      }

      async function loadSendRecords() {
        if (!state.sendSupported) return false;
        const response = await fetch("/api/session-send");
        if (response.status === 404) {
          state.sendSupported = false;
          const had = Object.keys(state.sendRecords).length > 0;
          state.sendRecords = {};
          state.sendConfirmationFlashes = {};
          return had;
        }
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        const records = { ...(body.records || {}) };
        Object.entries(records).forEach(([key, record]) => {
          if (record.state !== "confirmed") return;
          registerSendConfirmation(record);
          delete records[key];
        });
        (Array.isArray(body.confirmed) ? body.confirmed : []).forEach(registerSendConfirmation);
        Object.entries(state.sendConfirmationFlashes).forEach(([key, record]) => {
          if (!records[key]) records[key] = record;
        });
        const signature = JSON.stringify(records);
        if (signature === state.sendRecordsSignature) return false;
        state.sendRecords = records;
        state.sendRecordsSignature = signature;
        return true;
      }

      async function submitSessionInput(row, input, button) {
        const key = sessionKey(row);
        const text = input.value.trim();
        if (!text) { input.focus(); return; }
        const original = button.textContent;
        button.disabled = true;
        input.disabled = true;
        button.textContent = "发送中…";
        try {
          const response = await fetch(sendPath(row), jsonRequest("POST", {
            text, expectedHandle: row.live?.handle, expectedStatus: rawLiveState(row.live),
          }));
          const body = await response.json();
          if (!response.ok) throw new Error(SEND_CONFLICT_MESSAGES[body.code] || body.error || `HTTP ${response.status}`);
          delete state.sendConfirmationFlashes[key];
          state.sendRecords[key] = body.record;
          state.sendRecordsSignature = "";
          delete state.sendDrafts[key];
          input.value = "";
          showToast("已发送，已加入自动确认队列");
          renderCurrentView();
          sendInputElement(key)?.focus();
        } catch (error) {
          showToast(`发送失败：${error.message}`);
        } finally {
          input.disabled = false;
          button.disabled = false;
          button.textContent = original;
        }
      }

      function sessionSendForm(row) {
        if (!canSendInput(row)) return null;
        const key = sessionKey(row);
        const form = make("form", "session-send");
        form.dataset.sendKey = key;
        const input = make("input", "session-send-input");
        input.type = "text";
        input.value = state.sendDrafts[key] || "";
        input.placeholder = `发送给 ${row.agent}…`;
        input.setAttribute("aria-label", `发送输入到会话：${row.displayTitle}`);
        input.autocomplete = "off";
        input.spellcheck = false;
        let composing = false;
        let suppressCompositionSubmit = false;
        input.addEventListener("input", () => { state.sendDrafts[key] = input.value; });
        input.addEventListener("compositionstart", () => {
          composing = true;
          state.sendCompositionKey = key;
        });
        input.addEventListener("compositionend", () => {
          composing = false;
          suppressCompositionSubmit = true;
          state.sendDrafts[key] = input.value;
          finishSendComposition(key);
          setTimeout(() => { suppressCompositionSubmit = false; }, 0);
        });
        input.addEventListener("keydown", (event) => {
          if (event.isComposing || composing || event.keyCode === 229) {
            if (event.key === "Enter") suppressCompositionSubmit = true;
          }
        });
        const button = make("button", "session-send-button", "发送");
        button.type = "submit";
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          if (composing || suppressCompositionSubmit) return;
          submitSessionInput(row, input, button);
        });
        form.append(input, button);
        return form;
      }

      async function reuseSentInput(row, record) {
        const key = sessionKey(row);
        const input = sendInputElement(key);
        if (input) {
          input.value = record.text;
          state.sendDrafts[key] = record.text;
          input.focus();
          input.setSelectionRange(record.text.length, record.text.length);
        }
        await copyText(record.text, input ? "已复制并回填上次输入" : "已复制上次输入");
      }

      async function dismissSentInput(row) {
        const key = sessionKey(row);
        delete state.sendConfirmationFlashes[key];
        delete state.sendRecords[key];
        state.sendRecordsSignature = "";
        renderCurrentView();
        try { await api(sendPath(row), { method: "DELETE" }); }
        catch (error) { showToast(`清除记录失败：${error.message}`); }
      }

      function sentInputNote(row) {
        const record = state.sendRecords[sessionKey(row)];
        if (!record) return null;
        const note = make("div", "session-send-note");
        note.dataset.state = record.state;
        const stateLabel = SEND_STATE_LABELS[record.state] || "等待确认";
        const label = make("span", "session-send-state");
        label.setAttribute("role", "img");
        label.setAttribute("aria-label", stateLabel);
        label.title = record.state === "verifying"
          ? "正在核对：会话已进入进行中"
          : record.state === "confirmed"
            ? "已确认：核对到相同的用户输入"
            : record.state === "stalled" || record.state === "failed"
              ? "确认失败：未在时限内核对到相同的用户输入"
              : `${relativeTime(record.sentAt)}发送到终端 ${record.handle}`;
        label.append(lineIcon(SEND_STATE_ICONS[record.state] || "clock"));
        const text = make("span", "session-send-text", record.text);
        text.title = record.text;
        const copy = iconButton("session-send-copy", "复制上次输入", "copy");
        copy.addEventListener("click", () => reuseSentInput(row, record));
        const dismiss = iconButton("session-send-dismiss", "忽略", "x");
        dismiss.addEventListener("click", () => dismissSentInput(row));
        note.append(label, text, copy, dismiss);
        return note;
      }

      function sessionTasksFor(row) {
        return state.sessionTasks[sessionKey(row)] || [];
      }

      async function loadSessionTasks() {
        if (!state.tasksSupported) return false;
        const result = await optionalConditionalApi(
          "/api/session-tasks?refresh=1", state.sessionTasksEtag, { tasks: {} },
        );
        if (result.unsupported) { state.tasksSupported = false; return false; }
        if (result.unchanged) return false;
        state.sessionTasks = result.body.tasks || {};
        state.sessionTasksEtag = result.etag;
        return true;
      }

      async function reloadSessionTasks() {
        state.sessionTasksEtag = "";
        await loadSessionTasks();
        renderCurrentView();
      }

      async function ensureBoards(force) {
        if (state.boards && !force) return state.boards;
        state.boards = await api("/api/boards");
        return state.boards;
      }

      /** The board list lands after the first paint; redraw so the bound-project hint shows up. */
      function ensureBoardsThenRender() {
        if (state.boards) return;
        ensureBoards(false).then(renderCurrentView).catch(() => {});
      }

      function boundProjectLabel(row) {
        const project = state.boards?.bindings.find((binding) => binding.projectKey === row.projectKey);
        if (!project) return "";
        const board = state.boards.boards.find((candidate) => candidate.id === project.boardId);
        return `${board ? board.name : project.boardId} · ${project.boardProjectName}`;
      }

      function captureTargetOptions() {
        return (state.boards?.boards || []).flatMap((board) => board.projects
          .map((project) => ({
            boardId: board.id, projectId: project.id, label: `${board.name} · ${project.name}`,
          })))
          .map((option, index) => ({ ...option, value: String(index) }));
      }

      /** Turns a 409 into an inline picker instead of a dead end: the repo just needs a board project once. */
      async function openCapturePicker(key, message) {
        try { await ensureBoards(true); }
        catch (error) { showToast(`读取任务板失败：${error.message}`); return; }
        const options = captureTargetOptions();
        if (!options.length) {
          showToast("没有可用的任务板项目，先在任务板里建一个");
          return;
        }
        state.capturePickerKey = key;
        if (!options.some((option) => option.value === state.captureTarget)) {
          state.captureTarget = options[0].value;
        }
        if (message) showToast(message);
        renderCurrentView();
      }

      async function submitCapture(row, input, button) {
        const key = sessionKey(row);
        const title = input.value.trim();
        if (!title) { input.focus(); return; }
        const picked = state.capturePickerKey === key
          ? captureTargetOptions().find((option) => option.value === state.captureTarget) : null;
        const original = button.textContent;
        input.disabled = true;
        button.disabled = true;
        button.textContent = "捕捉中…";
        try {
          const response = await fetch(`/api/session-tasks/${encodeURIComponent(row.agent)}/${encodeURIComponent(row.sid)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title,
              ...(picked ? { boardId: picked.boardId, projectId: picked.projectId } : {}),
            }),
          });
          const body = await response.json();
          if (response.status === 409 && body.code === "project-required") {
            await openCapturePicker(key, "先选一个任务板项目，之后这个仓库就记住了");
            return;
          }
          if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
          delete state.captureDrafts[key];
          state.capturePickerKey = "";
          state.captureKey = "";
          input.value = "";
          if (body.binding) state.boards = null;
          showToast(body.backlinkError ? "已捕捉，但没能回写会话证据" : "已捕捉，等待落地");
          await reloadSessionTasks();
        } catch (error) {
          showToast(`捕捉失败：${error.message}`);
        } finally {
          input.disabled = false;
          button.disabled = false;
          button.textContent = original;
        }
      }

      async function removeSessionTask(row, task) {
        const path = `/api/session-tasks/${encodeURIComponent(row.agent)}/${encodeURIComponent(row.sid)}`
          + `/${encodeURIComponent(task.boardId)}/${encodeURIComponent(task.taskId)}`;
        try {
          await api(path, { method: "DELETE" });
          await reloadSessionTasks();
        } catch (error) {
          showToast(`移除失败：${error.message}`);
        }
      }

      function sessionTaskList(row) {
        const tasks = sessionTasksFor(row);
        if (!tasks.length) return null;
        const list = make("div", "session-tasks");
        tasks.forEach((task) => {
          const item = make("div", "session-task");
          item.dataset.kind = task.statusKind;
          item.append(make("span", "session-task-dot"));
          if (task.number) item.append(make("span", "session-task-number", task.number));
          const title = make("span", "session-task-title", task.title);
          title.title = `${task.title}\n${task.status}`;
          item.append(title);
          if (task.url) {
            const open = make("a", "action session-task-open", "打开");
            open.href = task.url;
            open.target = "_blank";
            open.rel = "noreferrer";
            item.append(open);
          }
          const remove = make("button", "action session-task-remove", "移除");
          remove.type = "button";
          remove.title = "只解除与本会话的关联，不删除任务板上的任务";
          remove.addEventListener("click", () => removeSessionTask(row, task));
          item.append(remove);
          list.append(item);
        });
        return list;
      }

      function captureForm(row) {
        const key = sessionKey(row);
        const form = make("form", "session-capture");
        form.dataset.captureKey = key;
        const input = make("input", "session-capture-input");
        input.type = "text";
        input.value = state.captureDrafts[key] || "";
        input.placeholder = CAPTURE_PLACEHOLDER;
        input.setAttribute("aria-label", `捕捉想法到会话：${row.displayTitle}`);
        input.addEventListener("input", () => { state.captureDrafts[key] = input.value; });
        const button = make("button", "action session-capture-button", "捕捉");
        button.type = "submit";
        form.append(input, button);
        if (state.capturePickerKey === key) {
          const picker = make("select", "session-capture-picker");
          picker.setAttribute("aria-label", "选择任务板项目");
          captureTargetOptions().forEach((option) => picker.append(new Option(option.label, option.value)));
          picker.value = state.captureTarget || "";
          picker.addEventListener("change", () => { state.captureTarget = picker.value; });
          form.append(picker);
        } else {
          const label = boundProjectLabel(row);
          if (label) {
            const target = make("button", "action session-capture-target", label);
            target.type = "button";
            target.title = "更换这个仓库的任务板项目";
            target.addEventListener("click", () => openCapturePicker(key, ""));
            form.append(target);
          }
        }
        const cancel = make("button", "action session-capture-cancel", "取消");
        cancel.type = "button";
        cancel.addEventListener("click", () => {
          state.captureKey = "";
          state.capturePickerKey = "";
          renderCurrentView();
        });
        form.append(cancel);
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          submitCapture(row, input, button);
        });
        return form;
      }

      function openCapture(row) {
        state.captureKey = sessionKey(row);
        state.capturePickerKey = "";
        ensureBoardsThenRender();
        renderCurrentView();
        const form = document.querySelector(`.session-capture[data-capture-key="${CSS.escape(state.captureKey)}"]`);
        form?.querySelector(".session-capture-input")?.focus();
      }

      function appendTaskControls(element, row) {
        if (!state.tasksSupported) return;
        const list = sessionTaskList(row);
        if (list) element.append(list);
        if (state.captureKey === sessionKey(row)) {
          element.append(captureForm(row));
          return;
        }
        if (!list) return;
        const opener = make("div", "session-capture-row");
        const button = make("button", "action session-capture-open", "＋想法");
        button.type = "button";
        button.addEventListener("click", () => openCapture(row));
        opener.append(button);
        element.append(opener);
      }

      /** The capture entry point lives with the row's other actions so it costs one click, not two. */
      function captureAction(row) {
        const tasks = sessionTasksFor(row);
        const button = make("button", "action capture-action", tasks.length ? `想法 ${tasks.length}` : "＋想法");
        button.type = "button";
        button.title = "捕捉一个想法，挂到这个会话上等待落地";
        button.addEventListener("click", () => openCapture(row));
        return button;
      }

      function appendSendControls(element, row) {
        const note = sentInputNote(row);
        if (note) element.append(note);
        const form = sessionSendForm(row);
        if (form) element.append(form);
      }

      function sessionRow(row, project, isSearch, options = {}) {
        const element = make("article", "session-row");
        element.tabIndex = -1;
        element.dataset.sid = row.sid;
        element.dataset.agent = row.agent;
        const dot = make("span", "status-dot");
        element.append(dot);

        const main = make("div", "session-main");
        const titleLine = make("div", "session-title-line");
        titleLine.append(make("span", `agent-badge agent-${row.agent}`, row.agent));
        const title = make("div", "session-title", row.displayTitle);
        if (row.indexed === false) title.title = [row.live?.name, row.sid].filter(Boolean).join(" · ");
        else if (row.title && row.firstPrompt) title.title = row.firstPrompt;
        titleLine.append(title);
        const liveState = make("span", "live-state");
        updateLivePresentation(dot, liveState, row.live);
        titleLine.append(liveState);
        main.append(titleLine);
        if (!isSearch && row.lastPrompt && row.lastPrompt !== row.displayTitle) {
          const lastInput = make("div", "row-last-input", row.lastPrompt);
          lastInput.title = row.lastPrompt;
          main.append(lastInput);
        }
        if (Array.isArray(row.hits) && row.hits.length) {
          const hits = make("div", "hits");
          row.hits.slice(0, 3).forEach((hit) => {
            const line = make("div", "hit");
            appendHighlighted(line, hit.snippet);
            hits.append(line);
          });
          main.append(hits);
        }
        element.append(main);

        const chips = make("div", "chips");
        if (row.indexed === false) chips.append(make("span", "chip", "无 transcript"));
        if (row.cwd && row.cwd !== (row.worktreeRoot || project.root)) chips.append(make("span", "chip", basename(row.cwd)));
        if (row.branch && row.branch !== "HEAD") chips.append(make("span", "chip", row.branch));
        (row.goals || []).forEach((goal) => {
          const button = make("button", "chip goal-chip", goal.name);
          button.type = "button";
          button.title = "打开目标：" + goal.name;
          button.addEventListener("click", () => selectGoal(goal.id));
          chips.append(button);
        });
        (options.reasons || []).forEach((reason) => chips.append(make("span", "chip reason-chip", reason.label)));
        element.append(chips);

        const facts = make("div", "facts");
        if (row.indexed === false) {
          facts.append(make("span", "", row.live?.pid ? `PID ${row.live.pid}` : "在线"), make("span", "", "未索引"));
        } else facts.append(make("span", "", relativeTime(row.lastInputAt)), make("span", "", `${row.promptCount} 轮`));
        element.append(facts);

        const actions = make("div", "actions");
        const focusButton = make(
          "button", `action focus-action ${row.live ? "focus-jump" : "focus-resume"}`,
          row.live ? "跳转" : "恢复",
        );
        focusButton.type = "button";
        focusButton.addEventListener("click", () => focusSession(row, focusButton, element));
        const { menu: drawer, panel: drawerPanel } = floatingMenu(
          `更多会话操作：${row.displayTitle}`, "action-drawer", "action drawer-toggle",
        );
        const copyButton = make("button", "action floating-menu-action drawer-action copy-action", "复制链接");
        copyButton.type = "button";
        copyButton.addEventListener("click", async () => {
          await copyText(`orcatab://${row.agent}/${row.sid}`, "已复制链接");
          drawer.open = false;
        });
        const commandButton = make("button", "action floating-menu-action drawer-action command-action", "复制命令");
        commandButton.type = "button";
        commandButton.addEventListener("click", async () => {
          const command = row.agent === "codex" ? `codex resume ${row.sid}`
            : row.agent === "hermes" ? `hermes --resume ${row.sid}` : `claude --resume ${row.sid}`;
          await copyText(command, "已复制命令");
          drawer.open = false;
        });
        drawerPanel.append(copyButton);
        if (row.indexed !== false) drawerPanel.append(commandButton);
        actions.append(focusButton, drawer);
        if (state.tasksSupported) actions.append(captureAction(row));
        if (options.goalPicker && row.indexed !== false) {
          const picker = make("select", "goal-picker");
          picker.setAttribute("aria-label", "添加到目标");
          picker.append(new Option("＋目标", ""));
          const linked = new Set((row.goals || []).map((goal) => goal.id));
          state.goals.filter((goal) => !linked.has(goal.id))
            .forEach((goal) => picker.append(new Option(goal.name, goal.id)));
          picker.append(new Option("新建…", "__new__"));
          picker.addEventListener("change", async () => {
            const value = picker.value;
            picker.value = "";
            if (!value) return;
            if (value === "__new__") { openGoalDialog(row); return; }
            await linkSession(value, row, "confirmed", false);
          });
          actions.append(picker);
        }
        (options.extraActions || []).forEach((item) => {
          const button = make("button", "action " + (item.className || ""), item.label);
          button.type = "button";
          button.addEventListener("click", () => item.run(button));
          actions.append(button);
        });
        element.append(actions);
        appendSendControls(element, row);
        appendTaskControls(element, row);
        return element;
      }

      function focusMonitorDockZone(clientX) {
        const dockWidth = Math.min(
          FOCUS_MONITOR_DOCK_MAX_PX,
          Math.max(FOCUS_MONITOR_DOCK_MIN_PX, window.innerWidth * FOCUS_MONITOR_DOCK_RATIO),
        );
        if (clientX <= dockWidth) return "left";
        if (clientX >= window.innerWidth - dockWidth) return "right";
        return null;
      }

      function setFocusMonitorDockTarget(zone) {
        focusMonitorDockLeft.classList.toggle("active", zone === "left");
        focusMonitorDockRight.classList.toggle("active", zone === "right");
      }

      function boundedFocusMonitorPosition(left, top) {
        const rect = focusMonitor.getBoundingClientRect();
        const maxLeft = Math.max(
          FOCUS_MONITOR_VIEWPORT_GAP_PX,
          window.innerWidth - rect.width - FOCUS_MONITOR_VIEWPORT_GAP_PX,
        );
        const maxTop = Math.max(
          FOCUS_MONITOR_TOP_OFFSET_PX,
          window.innerHeight - rect.height - FOCUS_MONITOR_VIEWPORT_GAP_PX,
        );
        return {
          left: Math.min(maxLeft, Math.max(FOCUS_MONITOR_VIEWPORT_GAP_PX, left)),
          top: Math.min(maxTop, Math.max(FOCUS_MONITOR_TOP_OFFSET_PX, top)),
        };
      }

      function resetFocusMonitorPosition() {
        focusMonitor.classList.remove("monitor-floating", "monitor-docked-left", "monitor-docked-right");
        ["left", "right", "top", "bottom"].forEach((property) => focusMonitor.style.removeProperty(property));
      }

      function positionFloatingFocusMonitor(left, top) {
        resetFocusMonitorPosition();
        focusMonitor.classList.add("monitor-floating");
        const bounded = boundedFocusMonitorPosition(left, top);
        focusMonitor.style.right = "auto";
        focusMonitor.style.bottom = "auto";
        focusMonitor.style.left = `${bounded.left}px`;
        focusMonitor.style.top = `${bounded.top}px`;
        return bounded;
      }

      function applyFocusMonitorPlacement() {
        resetFocusMonitorPosition();
        const placement = state.focusMonitorPlacement;
        focusMonitor.dataset.placement = placement.mode;
        if (placement.mode === "left" || placement.mode === "right") {
          focusMonitor.classList.add(`monitor-docked-${placement.mode}`);
          return;
        }
        focusMonitor.classList.add("monitor-floating");
        if (!Number.isFinite(placement.left) || !Number.isFinite(placement.top)) return;
        const bounded = boundedFocusMonitorPosition(placement.left, placement.top);
        focusMonitor.style.right = "auto";
        focusMonitor.style.bottom = "auto";
        focusMonitor.style.left = `${bounded.left}px`;
        focusMonitor.style.top = `${bounded.top}px`;
        if (bounded.left === placement.left && bounded.top === placement.top) return;
        state.focusMonitorPlacement = { mode: "floating", ...bounded };
        saveFocusMonitorPlacement(state.focusMonitorPlacement);
      }

      function beginFocusMonitorDrag(event) {
        if (event.button !== 0 || !event.isPrimary) return;
        if (event.target instanceof Element && event.target.closest("button")) return;
        const rect = focusMonitor.getBoundingClientRect();
        focusMonitorDrag = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          offsetX: event.clientX - rect.left,
          offsetY: event.clientY - rect.top,
          handle: event.currentTarget,
          moving: false,
        };
        event.currentTarget.setPointerCapture?.(event.pointerId);
        event.preventDefault();
      }

      function moveFocusMonitor(event) {
        const drag = focusMonitorDrag;
        if (!drag || event.pointerId !== drag.pointerId) return;
        if (!drag.moving) {
          const distance = Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY);
          if (distance < FOCUS_MONITOR_DRAG_THRESHOLD_PX) return;
          focusMonitorDrag = { ...drag, moving: true };
          focusMonitor.classList.add("dragging");
          focusView.classList.add("monitor-dragging");
        }
        const current = focusMonitorDrag;
        positionFloatingFocusMonitor(event.clientX - current.offsetX, event.clientY - current.offsetY);
        setFocusMonitorDockTarget(focusMonitorDockZone(event.clientX));
        event.preventDefault();
      }

      function finishFocusMonitorDrag(event, cancelled = false) {
        const drag = focusMonitorDrag;
        if (!drag || event.pointerId !== drag.pointerId) return;
        let nextPlacement = state.focusMonitorPlacement;
        if (drag.moving) {
          const zone = cancelled ? null : focusMonitorDockZone(event.clientX);
          if (zone) nextPlacement = { mode: zone };
          else {
            const rect = focusMonitor.getBoundingClientRect();
            nextPlacement = { mode: "floating", left: rect.left, top: rect.top };
          }
        }
        try { drag.handle.releasePointerCapture?.(drag.pointerId); } catch (_error) { /* capture already lost */ }
        focusMonitorDrag = null;
        focusMonitor.classList.remove("dragging");
        focusView.classList.remove("monitor-dragging");
        setFocusMonitorDockTarget(null);
        if (drag.moving) {
          state.focusMonitorPlacement = nextPlacement;
          saveFocusMonitorPlacement(nextPlacement);
          applyFocusMonitorPlacement();
        }
        if (!focusMonitorRenderPending) return;
        focusMonitorRenderPending = false;
        renderFocusMonitor();
      }

      function hideFocusMonitor() {
        state.focusMonitorSessionKey = "";
        focusMonitor.hidden = true;
        focusMonitor.replaceChildren();
        document.querySelectorAll(".focus-session-card.monitor-source")
          .forEach((card) => card.classList.remove("monitor-source"));
      }

      function focusMonitorRow() {
        if (!state.focusMonitorSessionKey) return null;
        return visibleFocusRows().find((row) => sessionKey(row) === state.focusMonitorSessionKey) || null;
      }

      function showFocusMonitor(row) {
        if (focusMonitorDrag?.moving) return;
        state.focusMonitorSessionKey = sessionKey(row);
        renderFocusMonitor();
      }

      async function loadMoreFocusInputs(row, button) {
        const key = sessionKey(row);
        if (state.recentInputsLoadingBySession[key]) return;
        const previousScrollTop = focusMonitor.querySelector(".focus-monitor-messages")?.scrollTop ?? null;
        state.recentInputsLoadingBySession = { ...state.recentInputsLoadingBySession, [key]: true };
        button.disabled = true;
        button.textContent = "加载中…";
        try {
          const currentInputs = state.recentInputsBySession[key] || [];
          const response = await fetch("/api/session-inputs", jsonRequest("POST", {
            sessions: [{ agent: row.agent, sid: row.sid }],
            limit: FOCUS_INPUT_PAGE_SIZE,
            offset: currentInputs.length,
          }));
          const body = await response.json();
          if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
          const nextInputs = Array.isArray(body.inputs?.[key]) ? body.inputs[key] : [];
          const nextTimes = Array.isArray(body.inputTimes?.[key]) ? body.inputTimes[key] : [];
          state.recentInputsBySession = {
            ...state.recentInputsBySession, [key]: [...currentInputs, ...nextInputs],
          };
          state.recentInputTimesBySession = {
            ...state.recentInputTimesBySession,
            [key]: [...(state.recentInputTimesBySession[key] || []), ...nextTimes],
          };
          state.recentInputsHasMoreBySession = {
            ...state.recentInputsHasMoreBySession, [key]: Boolean(body.hasMore?.[key]),
          };
        } catch (error) {
          showToast(`加载更多输入失败：${error.message}`);
        } finally {
          const loading = { ...state.recentInputsLoadingBySession };
          delete loading[key];
          state.recentInputsLoadingBySession = loading;
          if (state.focusMonitorSessionKey === key) renderFocusMonitor(previousScrollTop);
        }
      }

      function renderFocusMonitor(preservedScrollTop = null) {
        if (focusMonitorDrag) { focusMonitorRenderPending = true; return; }
        const row = focusMonitorRow();
        if (!row) { hideFocusMonitor(); return; }
        const key = sessionKey(row);
        const inputs = focusMonitorInputs(row);
        const project = projectFor(row.projectKey);
        const root = worktreeRootFor(row, project);
        const head = make("header", "focus-monitor-head");
        const heading = make("div", "focus-monitor-heading");
        heading.append(
          make("div", "focus-monitor-label", "Monitor"),
          make("h2", "focus-monitor-session", row.displayTitle),
        );
        const close = make("button", "focus-monitor-close", "×");
        close.type = "button";
        close.setAttribute("aria-label", "关闭 Monitor");
        close.addEventListener("click", hideFocusMonitor);
        const context = [row.agent, project.name, basename(root)].filter(Boolean).join(" · ");
        head.title = "拖动到浏览器左右边缘可吸附";
        head.addEventListener("pointerdown", beginFocusMonitorDrag);
        head.append(heading, close, make("div", "focus-monitor-context", context));

        const messages = make("div", "focus-monitor-messages");
        if (!inputs.length) {
          const message = state.recentInputsSupported ? "暂无已索引输入" : "服务更新后可查看输入记录";
          messages.append(make("div", "focus-monitor-empty", message));
        } else {
          inputs.forEach((input) => {
            const message = make("article", "focus-monitor-message");
            const formattedTime = focusInputTime(input.ts);
            if (formattedTime) {
              const time = make("time", "focus-monitor-time", formattedTime);
              time.dateTime = new Date(input.ts).toISOString();
              message.append(time);
            } else {
              message.classList.add("without-time");
            }
            const body = make("div", "focus-monitor-message-body");
            const bubble = make("div", "focus-monitor-bubble", input.text);
            body.append(bubble);
            message.append(body);
            messages.append(message);
          });
        }
        if (state.recentInputsHasMoreBySession[key]) {
          const more = make("div", "focus-monitor-more");
          const loading = Boolean(state.recentInputsLoadingBySession[key]);
          const button = make("button", "focus-monitor-more-button", loading ? "加载中…" : "加载更多");
          button.type = "button";
          button.disabled = loading;
          button.setAttribute("aria-label", "加载更早的用户输入");
          button.addEventListener("click", () => loadMoreFocusInputs(row, button));
          more.append(button);
          messages.append(more);
        }
        focusMonitor.replaceChildren(head, messages);
        focusMonitor.hidden = false;
        applyFocusMonitorPlacement();
        if (Number.isFinite(preservedScrollTop)) messages.scrollTop = preservedScrollTop;
        document.querySelectorAll(".focus-session-card").forEach((card) => {
          card.classList.toggle("monitor-source", card.dataset.agent === row.agent && card.dataset.sid === row.sid);
        });
      }

      function focusSessionCard(row) {
        const element = make("article", "focus-session-card");
        element.dataset.sid = row.sid;
        element.dataset.agent = row.agent;
        if (state.focusMonitorSessionKey === sessionKey(row)) element.classList.add("monitor-source");
        const dot = make("span", "status-dot");
        const main = make("div", "focus-session-main");
        const titleLine = make("div", "focus-session-title-line");
        titleLine.append(
          make("span", `agent-badge agent-${row.agent}`, row.agent),
          make("span", "focus-session-title", row.displayTitle),
        );
        const meta = make("div", "focus-session-meta");
        const liveState = make("span", "live-state");
        updateLivePresentation(dot, liveState, row.live);
        const updatedAt = row.live?.updatedAt;
        const status = rawLiveState(row.live);
        const timeLabel = typeof updatedAt === "number" && Number.isFinite(updatedAt)
          ? `${status === "done" ? "就绪" : "状态更新"} ${relativeTime(updatedAt)}`
          : "状态时间未知";
        meta.append(liveState, make("span", "focus-session-time", timeLabel));
        if (row.branch && row.branch !== "HEAD") meta.append(make("span", "chip", row.branch));
        main.append(titleLine, meta);
        const jump = make("button", "action focus-action focus-jump", "跳转");
        jump.type = "button";
        jump.addEventListener("click", () => focusSession(row, jump, element));
        element.addEventListener("mouseenter", () => showFocusMonitor(row));
        element.addEventListener("focusin", () => showFocusMonitor(row));
        element.append(dot, main, jump);
        appendSendControls(element, row);
        appendTaskControls(element, row);
        return element;
      }

      // The server assigns lanes and applies archive visibility; these are already the rows to draw.
      function focusLaneRows(key) {
        return state.focusBoard?.lanes?.find((lane) => lane.key === key)?.rows || [];
      }

      function visibleFocusRows() {
        return (state.focusBoard?.lanes || []).flatMap((lane) => lane.rows);
      }

      function renderFocusGroups(parent, laneKey, rows) {
        if (!rows.length) return;
        const projectGroups = new Map();
        rows.forEach((row) => {
          const group = projectGroups.get(row.projectKey) || [];
          group.push(row);
          projectGroups.set(row.projectKey, group);
        });
        orderedFocusProjectKeys(projectGroups).forEach((projectKey) => {
          const projectRows = projectGroups.get(projectKey);
          const project = projectFor(projectKey);
          const projectCollapseKey = focusProjectCollapseKey(laneKey, projectKey);
          const projectCollapsed = state.focusCollapsedProjects.has(projectCollapseKey);
          const firstProjectSession = projectRows[0];
          const projectBodyId = `focus-project-worktrees-${laneKey}-${firstProjectSession.agent}-${firstProjectSession.sid}`;
          const projectGroup = make("article", "focus-project-group");
          projectGroup.dataset.projectKey = projectKey;
          projectGroup.dataset.focusLane = laneKey;
          projectGroup.classList.toggle("collapsed", projectCollapsed);
          const projectHead = make("header", "focus-project-head");
          const projectToggle = make("button", "worktree-toggle focus-group-toggle");
          projectToggle.type = "button";
          projectToggle.setAttribute("aria-expanded", String(!projectCollapsed));
          projectToggle.setAttribute("aria-controls", projectBodyId);
          projectToggle.setAttribute("aria-label", `${projectCollapsed ? "展开" : "收起"}项目：${project.name}`);
          projectToggle.title = `${projectCollapsed ? "展开" : "收起"}项目：${project.name}`;
          projectToggle.addEventListener("click", () => {
            setFocusProjectCollapsed(projectCollapseKey, !projectCollapsed);
          });
          const color = make("span", "color-dot");
          if (project.color) color.style.setProperty("--project-color", project.color);
          projectHead.append(
            projectToggle,
            color,
            make("span", "focus-project-name", project.name),
            make("span", "focus-group-count", String(projectRows.length)),
          );
          const projectBody = make("div", "focus-project-body");
          projectBody.id = projectBodyId;
          projectBody.hidden = projectCollapsed;
          groupedWorktrees(projectRows, project, (row) => row.live?.updatedAt || 0).forEach((worktree) => {
            const worktreeCollapseKey = focusWorktreeCollapseKey(laneKey, projectKey, worktree.root);
            const worktreeCollapsed = state.focusCollapsedWorktrees.has(worktreeCollapseKey);
            const firstWorktreeSession = worktree.rows[0];
            const sessionListId = `focus-worktree-sessions-${laneKey}-${firstWorktreeSession.agent}-${firstWorktreeSession.sid}`;
            const worktreeGroup = make("section", "focus-worktree-group");
            worktreeGroup.dataset.worktreeRoot = worktree.root;
            worktreeGroup.dataset.focusLane = laneKey;
            worktreeGroup.classList.toggle("collapsed", worktreeCollapsed);
            const unindexed = project.key === UNINDEXED_LIVE_PROJECT_KEY;
            const worktreeName = basename(worktree.root) || (unindexed ? "在线进程" : "未知目录");
            const pathLabel = worktree.root || (unindexed ? "尚无 transcript" : "未识别 worktree");
            const kind = worktreeKind(worktree, project);
            const worktreeHead = make("header", "focus-worktree-head");
            worktreeHead.title = `${kind} · ${pathLabel}`;
            const worktreeToggle = make("button", "worktree-toggle focus-group-toggle");
            worktreeToggle.type = "button";
            worktreeToggle.setAttribute("aria-expanded", String(!worktreeCollapsed));
            worktreeToggle.setAttribute("aria-controls", sessionListId);
            worktreeToggle.setAttribute("aria-label", `${worktreeCollapsed ? "展开" : "收起"} worktree：${worktreeName}`);
            worktreeToggle.title = `${worktreeCollapsed ? "展开" : "收起"} worktree：${worktreeName}`;
            worktreeToggle.addEventListener("click", () => {
              setFocusWorktreeCollapsed(worktreeCollapseKey, !worktreeCollapsed);
            });
            worktreeHead.append(
              worktreeToggle,
              make("span", "focus-worktree-name", worktreeName),
              make("span", "focus-worktree-kind", kind),
              make("span", "focus-group-count", String(worktree.rows.length)),
            );
            const list = make("div", "focus-session-list");
            list.id = sessionListId;
            list.hidden = worktreeCollapsed;
            [...worktree.rows]
              .sort((left, right) => (right.live?.updatedAt || 0) - (left.live?.updatedAt || 0))
              .forEach((row) => list.append(focusSessionCard(row)));
            worktreeGroup.append(worktreeHead, list);
            projectBody.append(worktreeGroup);
          });
          projectGroup.append(projectHead, projectBody);
          parent.append(projectGroup);
        });
      }

      function renderFocus() {
        if (state.sendCompositionKey) { state.sendRenderPending = true; return; }
        const previousSendFocus = activeSendFocus();
        focusBoard.replaceChildren();
        FOCUS_LANES.forEach((definition) => {
          const rows = focusLaneRows(definition.key);
          const lane = make("section", "focus-lane");
          lane.dataset.focusBucket = definition.key;
          const head = make("header", "focus-lane-head");
          const copy = make("div");
          const title = make("h2", "focus-lane-title", definition.title);
          if (definition.range) title.append(make("small", "focus-lane-range", definition.range));
          copy.append(title, make("p", "focus-lane-note", definition.note));
          head.append(
            make("span", "focus-lane-marker"),
            copy,
            make("span", "focus-lane-count", String(rows.length)),
          );
          const body = make("div", "focus-lane-body");
          if (rows.length) renderFocusGroups(body, definition.key, rows);
          else body.append(make("div", "focus-empty", definition.empty));
          lane.append(head, body);
          focusBoard.append(lane);
        });
        renderFocusMonitor();
        restoreSendFocus(previousSendFocus);
      }

      function worktreeResourceDrawer(root, name) {
        const resources = state.worktreeResources.get(root) || [];
        if (!resources.length) return null;
        const { menu, panel } = floatingMenu(
          `可访问资源：${name}`, "resource-drawer", "action compact-menu-toggle", `资源 ${resources.length}`,
        );
        resources.forEach((resource) => {
          const card = make("section", "resource-card");
          const head = make("div", "resource-card-head");
          const app = make("span", "resource-app", resource.appName);
          app.title = resource.appName;
          head.append(app, make("span", "resource-port", `:${resource.port}`));
          const links = make("div", "resource-links");
          resource.links.forEach((item) => {
            const link = make("a", "resource-link");
            link.href = item.url;
            link.target = "_blank";
            link.rel = "noreferrer";
            link.title = `${item.kind === "gateway" ? "通过 nginx 网关打开" : "直接打开监听端口"}：${item.url}`;
            link.append(
              document.createTextNode(item.kind === "gateway" ? "网关" : "直连"),
              make("span", "resource-status", `HTTP ${item.status}`),
            );
            link.addEventListener("click", () => menu.removeAttribute("open"));
            links.append(link);
          });
          card.append(head, links);
          panel.append(card);
        });
        return menu;
      }

      function render() {
        if (state.sendCompositionKey) { state.sendRenderPending = true; return; }
        const previousSendFocus = activeSendFocus();
        state.activeRow = -1;
        const isSearch = Boolean(state.query);
        content.replaceChildren();
        if (!state.sessions.length) {
          content.append(make("div", "empty", state.query ? "没有匹配的会话" : "当前筛选下没有会话"));
          return;
        }
        const groups = new Map();
        state.sessions.forEach((row) => {
          const rows = groups.get(row.projectKey) || [];
          rows.push(row);
          groups.set(row.projectKey, rows);
        });
        const orderedKeys = orderedProjectKeys(groups);
        orderedKeys.forEach((key) => {
          const rows = groups.get(key);
          const project = projectFor(key);
          const section = make("div", "group");
          const stack = make("div", "worktree-stack");
          groupedWorktrees(rows, project).forEach((worktree) => {
            const cluster = make("section", "worktree-cluster");
            cluster.dataset.worktreeRoot = worktree.root;
            const worktreeRows = [...worktree.rows]
              .sort((a, b) => (b.lastInputAt || 0) - (a.lastInputAt || 0));
            const firstSession = worktreeRows[0];
            const collapseKey = worktree.root || `${project.key}:unknown`;
            const collapsed = !isSearch && state.collapsedWorktrees.has(collapseKey);
            const unindexedGroup = project.key === UNINDEXED_LIVE_PROJECT_KEY;
            const worktreeName = basename(worktree.root) || (unindexedGroup ? "在线进程" : "未知目录");
            cluster.classList.toggle("collapsed", collapsed);
            const worktreeHeader = make("header", "worktree-header");
            if (!isSearch) {
              const toggle = make("button", "worktree-toggle");
              toggle.type = "button";
              toggle.setAttribute("aria-expanded", String(!collapsed));
              toggle.setAttribute("aria-controls", `worktree-sessions-${firstSession.agent}-${firstSession.sid}`);
              toggle.setAttribute("aria-label", `${collapsed ? "展开" : "收起"} worktree：${worktreeName}`);
              toggle.title = `${collapsed ? "展开" : "收起"} worktree：${worktreeName}`;
              toggle.addEventListener("click", () => setWorktreeCollapsed(collapseKey, !collapsed));
              worktreeHeader.append(toggle);
            }
            const color = make("span", "color-dot");
            if (project.color) color.style.setProperty("--project-color", project.color);
            const name = make("h2", "worktree-name", worktreeName);
            name.title = worktree.root || (unindexedGroup ? "live provider 已报告进程，但没有可读取的 transcript" : "未识别 worktree");
            const worktreeTitle = make("div", "worktree-title");
            worktreeTitle.append(name);
            const pathLabel = worktree.root || (unindexedGroup ? "live process · transcript 尚未建立或不可见" : "未识别 worktree");
            const path = make("span", "worktree-path", pathLabel);
            path.title = pathLabel;
            const worktreePreference = state.worktreePreferences.get(worktree.root);
            const worktreeArchived = Boolean(worktreePreference?.archived);
            const worktreePinned = Boolean(worktreePreference?.pinned);
            if (worktreePinned) worktreeTitle.append(pinIndicator("worktree 已置顶"));
            const focus = make("button", "action worktree-focus", "回到 Orca");
            focus.type = "button";
            focus.dataset.agent = firstSession.agent;
            focus.dataset.sid = firstSession.sid;
            focus.title = `回到第一个会话：${firstSession.displayTitle}`;
            focus.addEventListener("click", () => focusWorktreeSession(firstSession, worktreeName, focus));
            worktreeHeader.append(
              color,
              worktreeTitle,
              make("span", "worktree-kind", worktreeKind(worktree, project)),
              path,
              make("span", "worktree-meta", unindexedGroup
                ? `${worktree.rows.length} 个在线进程`
                : `${worktree.rows.length} 个会话 · 最近 ${relativeTime(worktree.latest || null)}`),
            );
            const resourceDrawer = worktreeResourceDrawer(worktree.root, worktreeName);
            if (resourceDrawer) worktreeHeader.append(resourceDrawer);
            worktreeHeader.append(focus);
            if (state.worktreesSupported && !project.archived && worktree.root) {
              const archive = make(
                "button", `action floating-menu-action worktree-archive${worktreeArchived ? " restore" : ""}`,
                worktreeArchived ? "恢复" : "归档",
              );
              archive.type = "button";
              archive.title = `${worktreeArchived ? "恢复" : "归档"} worktree：${worktreeName}`;
              archive.addEventListener("click", () => updateWorktreePreference(
                project, worktree.root, { archived: !worktreeArchived }, archive,
              ));
              const { menu, panel } = floatingMenu(
                `更多 worktree 操作：${worktreeName}`, "worktree-menu", "action compact-menu-toggle",
              );
              if (!worktreeArchived && state.worktreePinSupported) {
                const pin = make(
                  "button", `action floating-menu-action worktree-pin${worktreePinned ? " active" : ""}`,
                  worktreePinned ? "取消置顶" : "置顶",
                );
                pin.type = "button";
                pin.title = `${worktreePinned ? "取消置顶" : "置顶"} worktree：${worktreeName}`;
                pin.addEventListener("click", () => updateWorktreePreference(
                  project, worktree.root, { pinned: !worktreePinned }, pin,
                ));
                panel.append(pin);
              }
              panel.append(archive);
              worktreeHeader.append(menu);
            }
            const list = make("div", "session-list");
            list.id = `worktree-sessions-${firstSession.agent}-${firstSession.sid}`;
            list.hidden = collapsed;
            worktreeRows.forEach((row) => list.append(sessionRow(row, project, isSearch, { goalPicker: true })));
            cluster.append(worktreeHeader, list);
            stack.append(cluster);
          });
          section.append(stack);
          content.append(section);
        });
        restoreSendFocus(previousSendFocus);
      }

      function renderProjects() {
        projectList.replaceChildren();
        const archivedProjectKeys = new Set(state.projects.filter((project) => project.archived).map((project) => project.key));
        const activeProjectKeys = new Set(state.projects.filter((project) => !project.archived).map((project) => project.key));
        const archivedProjectCount = archivedProjectKeys.size;
        const archivedWorktreeCount = [...state.worktreePreferences.values()]
          .filter((preference) => preference.archived && activeProjectKeys.has(preference.projectKey)).length;
        const archivedCount = archivedProjectCount + archivedWorktreeCount;
        const scopeLabel = state.showArchived ? "返回项目" : `已归档 ${archivedCount}`;
        projectScopeTitle.textContent = state.showArchived ? "已归档" : "项目";
        for (const toggle of [archivedProjects, mobileArchivedProjects]) {
          toggle.textContent = scopeLabel;
          toggle.setAttribute("aria-pressed", String(state.showArchived));
        }
        mobileProject.replaceChildren(new Option(state.showArchived ? "全部归档" : "全部项目", ""));
        visibleProjects().forEach((project) => {
          const item = make("div", "project-item");
          const button = make("button", `project-button${state.selectedProject === project.key ? " active" : ""}`);
          button.type = "button";
          const label = make("span", "project-label");
          label.append(make("span", "name", project.name));
          if (project.pinned) label.append(pinIndicator("项目已置顶"));
          const working = projectWorkingIndicator(project.key);
          if (working) label.append(working);
          button.append(label, make("span", "count", String(project.sessionCount)));
          button.addEventListener("click", () => selectProject(state.selectedProject === project.key ? "" : project.key));
          const { menu, panel } = floatingMenu(
            `项目操作：${project.name}`, "project-item-menu", "project-menu-toggle", "⋯",
          );
          if (!project.archived) {
            panel.append(projectPreferenceButton(
              project, project.pinned ? "取消置顶" : "置顶", { pinned: !project.pinned }, `project-control floating-menu-action${project.pinned ? " active" : ""}`,
            ));
          }
          panel.append(projectPreferenceButton(
            project, project.archived ? "恢复" : "归档", { archived: !project.archived }, "project-control floating-menu-action",
          ));
          item.append(button, menu);
          projectList.append(item);
          const workingCount = projectWorkingCount(project.key);
          const workingLabel = workingCount ? ` · ${workingCount} working` : "";
          mobileProject.append(new Option(`${project.name}${workingLabel} (${project.sessionCount})`, project.key));
        });
        mobileProject.value = state.selectedProject;
      }

      function auditStat(value, label, tone = "") {
        const stat = make("div", `audit-stat ${tone}`.trim());
        stat.append(make("strong", "", String(value)), make("span", "", label));
        return stat;
      }

      function auditEntry(title, path, badge, tone = "", reasons = "") {
        const entry = make("div", "audit-entry");
        const name = make("div", "audit-entry-title", title);
        name.title = title;
        entry.append(name, make("span", `audit-badge ${tone}`.trim(), badge));
        const pathRow = make("div", "audit-entry-path", path || "未解析路径");
        pathRow.title = path || "未解析路径";
        entry.append(pathRow);
        if (reasons) entry.append(make("div", "audit-reasons", reasons));
        return entry;
      }

      function renderDirectoryAudit() {
        directoryAuditSummary.replaceChildren();
        directoryAuditList.replaceChildren();
        if (!state.directoryAuditSupported) {
          directoryAuditSummary.append(auditStat("—", "服务尚未支持"));
          archiveMissingDirectories.disabled = true;
          archiveMissingDirectories.textContent = "服务尚未支持";
          return;
        }
        const audit = state.directoryAudit;
        if (!audit) {
          directoryAuditSummary.append(auditStat("…", "正在审计"));
          return;
        }
        const summary = audit.summary;
        directoryAuditSummary.append(
          auditStat(`${summary.missingProjectRoots}/${summary.projectRoots}`, "失效项目根", summary.missingProjectRoots ? "review" : "ready"),
          auditStat(`${summary.missingDirectoryGroups}/${summary.directoryGroups}`, "失效目录组", summary.missingDirectoryGroups ? "review" : "ready"),
          auditStat(summary.gitWorktrees, "Git worktree"),
          auditStat(summary.historicalDirectories, "历史工作目录"),
          auditStat(summary.unknownProjectRoots + summary.unknownDirectories, "未解析路径"),
        );
        const projectTargets = audit.archivePlan.projectKeys.length;
        const directoryTargets = audit.archivePlan.worktrees.length;
        const targetCount = projectTargets + directoryTargets;
        archiveMissingDirectories.disabled = targetCount === 0;
        archiveMissingDirectories.textContent = targetCount
          ? `归档 ${projectTargets} 个项目 + ${directoryTargets} 个目录`
          : "没有待归档项";
        const missingProjects = audit.projects.filter((project) => project.missing);
        const missingDirectories = audit.directories.filter((directory) => directory.missing);
        const unknownProjects = audit.projects.filter((project) => !project.root);
        const unknownDirectories = audit.directories.filter((directory) => directory.kind === "unknown");
        directoryAuditLabel.textContent = `失效清单：${missingProjects.length} 个项目根 · ${missingDirectories.length} 个目录组 · ${unknownDirectories.length} 个未解析组`;
        missingProjects.forEach((project) => directoryAuditList.append(auditEntry(
          `${project.name} · ${project.sessionCount} 个会话`, project.root, "项目根", project.archived ? "" : "review",
          project.archived ? "已归档" : "待归档项目；仅隐藏索引分组",
        )));
        const plannedProjects = new Set(audit.archivePlan.projectKeys);
        const plannedDirectories = new Set(audit.archivePlan.worktrees.map((item) => `${item.projectKey}\0${item.root}`));
        const kindLabel = { "git-worktree": "Git worktree", "historical-directory": "历史工作目录", unknown: "未解析目录" };
        missingDirectories.forEach((directory) => {
          const planned = plannedDirectories.has(`${directory.projectKey}\0${directory.root}`);
          const covered = plannedProjects.has(directory.projectKey);
          const reason = directory.archived ? "已归档" : covered ? "将随失效项目归档"
            : planned ? "待归档目录组" : "保留审计记录，不创建空路径偏好";
          directoryAuditList.append(auditEntry(
            `${directory.projectName} · ${directory.sessionCount} 个会话`, directory.root,
            kindLabel[directory.kind] || directory.kind, directory.archived ? "" : "review", reason,
          ));
        });
        unknownProjects.forEach((project) => directoryAuditList.append(auditEntry(
          `${project.name} · ${project.sessionCount} 个会话`, "", "未解析项目", "review", "没有路径证据，不自动归档",
        )));
        unknownDirectories.forEach((directory) => directoryAuditList.append(auditEntry(
          `${directory.projectName} · ${directory.sessionCount} 个会话`, "", "未解析目录", "review", "没有 cwd，不自动归档",
        )));
      }

      function renderOrcaAudit() {
        orcaAuditSummary.replaceChildren();
        orcaAuditList.replaceChildren();
        if (!state.orcaAuditSupported) {
          orcaAuditSummary.append(auditStat("—", "服务尚未支持"));
          luminaAuditNote.textContent = "当前版本没有只读 Orca 审计接口";
          return;
        }
        const audit = state.orcaAudit;
        if (!audit) {
          orcaAuditSummary.append(auditStat("…", "正在审计"));
          return;
        }
        const summary = audit.summary;
        orcaAuditSummary.append(
          auditStat(summary.completedWorktrees, "completed"),
          auditStat(summary.ready, "可归档", "ready"),
          auditStat(summary.review, "需复核", "review"),
          auditStat(summary.hold, "暂缓", "hold"),
        );
        const lumina = summary.lumina;
        luminaAuditNote.textContent = `Lumina ${lumina.total}：${lumina.completed} completed · ${lumina.inProgress} in-progress · ${lumina.inReview} in-review`;
        orcaAuditLabel.textContent = `${summary.completedWorktrees} 条 completed：${summary.ready} 可归档 · ${summary.review} 需复核 · ${summary.hold} 暂缓`;
        const labels = { ready: "可归档", review: "需复核", hold: "暂缓" };
        audit.items.forEach((item) => orcaAuditList.append(auditEntry(
          `${item.projectId.split("/").pop()} · ${item.name}`,
          item.path,
          labels[item.recommendation] || item.recommendation,
          item.recommendation === "ready" ? "" : item.recommendation,
          [item.reasons.join(" · "), item.comment].filter(Boolean).join("；"),
        )));
        (audit.warnings || []).forEach((warning) => orcaAuditList.append(auditEntry(
          "审计警告", "", "警告", "review", warning,
        )));
      }

      async function archiveMissingDirectoryGroups() {
        const audit = state.directoryAudit;
        if (!audit) return;
        const projects = audit.archivePlan.projectKeys.length;
        const directories = audit.archivePlan.worktrees.length;
        if (projects + directories === 0) return;
        const confirmed = window.confirm(
          `将归档 ${projects} 个失效项目和 ${directories} 个失效目录组。\n\n只写 OrcaTab 归档偏好；不会删除索引行或 transcript。`,
        );
        if (!confirmed) return;
        archiveMissingDirectories.disabled = true;
        try {
          const result = await api("/api/directory-audit/archive-missing", { method: "POST" });
          state.directoryAudit = result.audit;
          const [projectResult, worktreeResult] = await Promise.all([
            conditionalApi("/api/projects", ""),
            optionalConditionalApi("/api/worktrees", "", []),
          ]);
          state.projects = projectResult.body;
          state.projectEtag = projectResult.etag;
          applyWorktreePreferences(worktreeResult.body);
          state.worktreeEtag = worktreeResult.etag;
          if (state.selectedProject && state.projects.find((project) => project.key === state.selectedProject)?.archived) {
            state.selectedProject = "";
          }
          syncSessionLive();
          renderProjects();
          render();
          renderProjectManagement();
          renderDirectoryAudit();
          showToast(`已归档 ${result.applied.projects} 个项目和 ${result.applied.worktrees} 个目录组；${result.indexedSessionsPreserved} 条索引会话保留`);
        } catch (error) { showToast(`批量归档失败：${error.message}`); }
        finally { renderDirectoryAudit(); }
      }

      function filteredManagedProjects() {
        const query = state.projectQuery.toLocaleLowerCase("zh-CN");
        return state.projects.filter((project) => {
          const inScope = state.projectScope === "all"
            || (state.projectScope === "active" && !project.archived)
            || (state.projectScope === "pinned" && project.pinned)
            || (state.projectScope === "archived" && project.archived);
          if (!inScope) return false;
          if (!query) return true;
          return `${project.name} ${project.root} ${project.key}`.toLocaleLowerCase("zh-CN").includes(query);
        });
      }

      function managedProjectMetric(value, label, className = "") {
        const metric = make("div", `managed-project-metric ${className}`.trim());
        metric.append(make("strong", "", value), make("span", "", label));
        return metric;
      }

      function renderProjectManagement() {
        renderDirectoryAudit();
        renderOrcaAudit();
        const active = state.projects.filter((project) => !project.archived).length;
        const pinned = state.projects.filter((project) => project.pinned).length;
        const archived = state.projects.filter((project) => project.archived).length;
        activeProjectCount.textContent = String(active);
        pinnedProjectCount.textContent = String(pinned);
        archivedProjectCount.textContent = String(archived);
        allProjectCount.textContent = String(state.projects.length);
        projectSummary.querySelectorAll("[data-project-scope]").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.projectScope === state.projectScope));
        });

        const projects = filteredManagedProjects();
        managedProjectCount.textContent = `显示 ${projects.length} / ${state.projects.length} 个`;
        projectManagementList.replaceChildren();
        if (!projects.length) {
          projectManagementList.append(make("div", "empty", state.projectQuery ? "没有匹配的项目" : "当前筛选下没有项目"));
          return;
        }

        projects.forEach((project) => {
          const row = make("article", "managed-project");
          row.dataset.projectKey = project.key;
          const main = make("div", "managed-project-main");
          const color = make("span", "color-dot");
          if (project.color) color.style.setProperty("--project-color", project.color);
          const identity = make("div", "managed-project-identity");
          const title = make("div", "managed-project-title");
          title.append(make("span", "managed-project-name", project.name));
          if (project.pinned) title.append(pinIndicator("项目已置顶"));
          const working = projectWorkingIndicator(project.key);
          if (working) title.append(working);
          if (project.archived) title.append(make("span", "project-status", "已归档"));
          identity.append(title, make("div", "managed-project-path", project.root || project.key));
          main.append(color, identity);

          const actions = make("div", "managed-project-actions");
          const sessions = make("button", "action primary", "查看会话");
          sessions.type = "button";
          sessions.addEventListener("click", () => openManagedProjectSessions(project));
          const focus = make("button", "action", "回到 Orca");
          focus.type = "button";
          focus.addEventListener("click", () => focusProject(project, focus));
          const { menu, panel } = floatingMenu(
            `更多项目操作：${project.name}`, "managed-project-menu", "action compact-menu-toggle",
          );
          if (!project.archived) {
            panel.append(projectPreferenceButton(
              project, project.pinned ? "取消置顶" : "置顶", { pinned: !project.pinned }, "action floating-menu-action",
            ));
          }
          panel.append(projectPreferenceButton(
            project, project.archived ? "恢复" : "归档", { archived: !project.archived }, "action floating-menu-action",
          ));
          actions.append(sessions, focus, menu);
          row.append(
            main,
            managedProjectMetric(String(project.sessionCount), "会话"),
            managedProjectMetric(relativeTime(project.lastInputAt), "最近活动", "activity"),
            actions,
          );
          projectManagementList.append(row);
        });
      }

      function jsonRequest(method, body) {
        return { method, headers: { "content-type": "application/json" }, body: JSON.stringify(body) };
      }

      function projectPreferenceButton(project, label, patch, className) {
        const button = make("button", className, label);
        button.type = "button";
        button.title = `${label}项目 ${project.name}`;
        button.setAttribute("aria-label", button.title);
        button.addEventListener("click", () => updateProjectPreference(project, patch, button));
        return button;
      }

      async function updateProjectPreference(project, patch, button) {
        button.disabled = true;
        try {
          await api("/api/projects", jsonRequest("PATCH", { projectKey: project.key, ...patch }));
          const projects = await conditionalApi("/api/projects", "");
          state.projects = projects.body;
          state.projectEtag = projects.etag;
          if (patch.archived !== undefined && state.selectedProject === project.key) state.selectedProject = "";
          syncSessionLive();
          renderProjects();
          render();
          renderProjectManagement();
          const message = patch.archived === true ? `已归档 ${project.name}，可在“已归档”中恢复`
            : patch.archived === false ? `已恢复 ${project.name}`
              : patch.pinned ? `已置顶 ${project.name}` : `已取消置顶 ${project.name}`;
          showToast(message);
        } catch (error) { showToast(`更新项目失败：${error.message}`); }
        finally { button.disabled = false; }
      }

      async function updateWorktreePreference(project, root, patch, button) {
        button.disabled = true;
        const name = basename(root) || root;
        try {
          await api("/api/worktrees", jsonRequest("PATCH", { projectKey: project.key, root, ...patch }));
          const preferences = await conditionalApi("/api/worktrees", "");
          applyWorktreePreferences(preferences.body);
          state.worktreeEtag = preferences.etag;
          const projectHasArchivedWorktree = [...state.worktreePreferences.values()]
            .some((preference) => preference.archived && preference.projectKey === project.key);
          if (patch.archived === false && state.showArchived && !projectHasArchivedWorktree) state.selectedProject = "";
          syncSessionLive();
          renderProjects();
          render();
          const message = patch.archived === true ? `已归档 worktree ${name}，可在“已归档”中恢复`
            : patch.archived === false ? `已恢复 worktree ${name}`
              : patch.pinned ? `已置顶 worktree ${name}` : `已取消置顶 worktree ${name}`;
          showToast(message);
        } catch (error) { showToast(`更新 worktree 失败：${error.message}`); }
        finally { button.disabled = false; }
      }

      }

      function renderGateway() {
        gatewayContent.replaceChildren();
        if (!state.gatewaySupported) {
          gatewayContent.append(make("div", "empty", "当前后端版本尚未提供网关发现，服务更新后刷新页面即可。"));

        if (!state.gateway) {

        }
        const snapshot = state.gateway;
        const head = make("header", "gateway-head");

        title.append(make("h1", "", "网关"), make("p", "", "只读展示本机与容器 nginx 配置，不执行 reload 或写入。"));
        head.append(title, make(
          "span", "gateway-scan",
          `${snapshot.sources.length} 个来源 · ${snapshot.routes.length} 条路由 · 扫描于 ${relativeTime(snapshot.scannedAt)}`,
        ));
        gatewayContent.append(head);
        if (snapshot.warnings.length) {
          const warnings = make("div", "gateway-warnings");
          snapshot.warnings.forEach((warning) => warnings.append(make("span", "", warning)));
          gatewayContent.append(warnings);
        }

        const routes = make("section", "gateway-section");
        const routeHead = make("header", "gateway-section-head");
        routeHead.append(make("h2", "", "反向代理"), make("span", "", `${snapshot.routes.length} 条`));
        routes.append(routeHead);
        if (!snapshot.routes.length) routes.append(make("div", "empty", "没有解析到 proxy_pass 路由"));
        else {
          const list = make("div", "gateway-route-list");
          snapshot.routes.forEach((route) => {
            const card = make("article", "gateway-route");
            const names = route.serverNames.join(", ") || "未声明 server_name";
            const name = make("div", "gateway-route-title", names);
            name.title = names;
            card.append(
              name,
              make("code", "", `${route.listen.join(", ") || "listen 80"} · ${route.location} → ${route.proxyPass}`),
              make("code", "", `${route.source} · ${route.file}`),
            );
            if (route.urls.length) {
              const links = make("div", "gateway-route-links");
              route.urls.forEach((url) => {
                const link = make("a", "", url);
                link.href = url;
                link.target = "_blank";
                link.rel = "noreferrer";
                links.append(link);
              });
              card.append(links);
            }
            list.append(card);
          });
          routes.append(list);
        }
        gatewayContent.append(routes);

        const configs = make("section", "gateway-section");
        const configHead = make("header", "gateway-section-head");
        configHead.append(make("h2", "", "只读配置"), make("span", "", `${snapshot.files.length} 个文件`));
        configs.append(configHead);
        if (!snapshot.files.length) configs.append(make("div", "empty", "没有发现可读取的 nginx 配置"));
        else {
          const list = make("div", "gateway-configs");
          snapshot.files.forEach((file) => {
            const details = make("details", "gateway-config");
            const summary = make("summary");
            const path = make("span", "gateway-config-path", file.path);
            path.title = file.sourcePath;
            summary.append(path, make("span", "gateway-config-source", file.source));
            const code = make("pre", "", file.content);
            details.append(summary, code);
            list.append(details);
          });
          configs.append(list);

        gatewayContent.append(configs);
